<style>
/* Farben wie auf dem Display (ui_theme.h), damit Waage und Browser gleich aussehen */
:root{--bg:#090909;--card:#181818;--card2:#121212;--line:#2C2C2C;--line2:#222222;--text:#F4F4F1;
--text2:#C4C4C0;--mut:#9C9C98;--faint:#62625F;--acc:#3DDC97;--acc2:#2FB77C;--on-acc:#0B1F16;
--accbg:#14281F;--accbd:#1E3B2C;--bar:#2FB77C;--warn:#F5B83D;--warnbg:#2A2214;--dan:#FF6B5E;--danbg:#2B1714;--track:#232323;
--pri:var(--acc);--on-pri:var(--on-acc);--ui:var(--acc);--accsh:rgba(61,220,151,.18)}
/* Farbschema "Weiß" (an der Waage: Setup -> Waage -> Farbe): alle Akzente in Weiß */
html[data-theme=w]{--acc:#F4F4F1;--acc2:#C4C4C0;--on-acc:#0A0A0A;--accbg:#1C1C1C;--accbd:#2C2C2C;--bar:#C4C4C0;--pri:var(--acc);--on-pri:var(--on-acc);--ui:var(--text)}
*{box-sizing:border-box}
button,.btn,a.chip,a.tile{transition:transform .12s,background-color .2s}
button:active,.btn:active,a.chip:active{transform:scale(.97)}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.big,.mid,h1{font-variant-numeric:tabular-nums}
html,body{margin:0;background:var(--bg);color:var(--text);
font:16px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 34px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font:600 24px/1.2 "Space Grotesk",system-ui,sans-serif}
h2{margin:0;font:600 17px/1.3 "Space Grotesk",system-ui,sans-serif}
/* Kopfzeile: runder Zurück-Knopf, Titel mittig, Aktion rechts */
.hdr{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;min-height:48px}
.hdr .t{text-align:center;font:600 20px/1.2 "Space Grotesk",system-ui,sans-serif}
.back{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);
color:var(--text);display:flex;align-items:center;justify-content:center;text-decoration:none;padding:0}
.back svg{display:block;width:22px;height:22px}
a.tile .ic svg{width:26px;height:26px;display:block}
a.chip svg{display:block;color:var(--ui)}
.act{color:var(--ui);text-decoration:none;font-size:15px;font-weight:500;padding:6px 2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{font-size:13px;padding:5px 11px;border-radius:14px;background:var(--accbg);color:var(--acc);white-space:nowrap}
.pill.w{background:var(--warnbg);color:var(--warn)}.pill.d{background:var(--danbg);color:var(--dan)}
.pill.n{background:var(--line);color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;
display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{background:var(--card2)}
.mut{color:var(--mut);font-size:14px}.faint{color:var(--faint);font-size:13px}
.big{font:500 54px/1 "Space Grotesk",system-ui,sans-serif;letter-spacing:-1px}
.big small{font-size:22px;color:var(--mut);letter-spacing:0;margin-left:6px}
.mid{font:500 28px/1.1 "Space Grotesk",system-ui,sans-serif}
.center{text-align:center;align-items:center}
/* Ringanzeige wie auf dem Display */
.ring{position:relative;width:230px;height:230px;margin:2px auto}
.ring svg{transform:rotate(-90deg);width:230px;height:230px;display:block}
.ring .tr{fill:none;stroke:var(--track);stroke-width:12}
.ring .in{fill:none;stroke:var(--acc);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .3s}
.ring .mid2{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.bar>div{height:8px;background:var(--acc);width:0;transition:width .3s}
.bar.over>div{background:var(--dan)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
button,.btn{min-height:46px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--card2);
color:var(--text);font-family:inherit;font-size:16px;font-weight:500;line-height:1;cursor:pointer;
display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
button.p,.btn.p{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
button.d{color:var(--dan)}button.g,.btn.g{flex:1}
button:disabled{opacity:.4}
button.sm,.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
/* runde Aktionsknöpfe wie am Gerät */
.rnd{display:flex;gap:14px;justify-content:center;align-items:center}
.rnd button{width:74px;height:74px;border-radius:50%;padding:0;font-size:15px}
.rnd button.p{box-shadow:0 6px 18px var(--accsh)}
html[data-theme=w] .rnd button.p{box-shadow:0 6px 18px rgba(244,244,241,.10)}
input,select,textarea{min-height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;
font-family:inherit;font-size:16px;background:var(--card2);color:var(--text);width:100%;min-width:0}
select{-webkit-appearance:none;appearance:none;padding-right:34px;
background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);
background-position:calc(100% - 18px) 21px,calc(100% - 12px) 21px;background-size:6px 6px,6px 6px;background-repeat:no-repeat}
select option{background:#1E1F1B;color:#F3F0E8}
input[type=checkbox]{width:0;height:0;opacity:0;position:absolute}
input[type=range]{accent-color:var(--acc);min-height:28px;border:0;padding:0;background:transparent}
/* Schalter */
.sw{width:52px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:0 0 52px;cursor:pointer}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--faint);transition:.2s}
.sw.on{background:var(--accbg)}.sw.on:after{left:25px;background:var(--acc)}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:54px;border-bottom:1px solid var(--line2)}
.set:last-child{border-bottom:0}
.set>span:first-child{flex:1}.set input:not([type=checkbox]),.set select{width:auto;max-width:170px}
/* Kacheln und Chips */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
a.tile{text-decoration:none;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:7px;font-size:13px;text-align:center}
a.tile .ic{width:56px;height:56px;border-radius:18px;background:var(--card);border:1px solid var(--line);
display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--ui)}
a.tile:active .ic{background:var(--accbg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
a.chip,button.chip,span.chip{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:14px;
background:var(--card);border:1px solid var(--line);color:var(--text);text-decoration:none;font-size:14px;min-height:0}
button.chip.on{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.sec{font:600 15px/1.3 "Space Grotesk",system-ui,sans-serif;color:var(--text);margin:6px 2px -2px}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:50px;border-bottom:1px solid var(--line2)}
.list .it:last-child{border-bottom:0}
.dot{width:14px;height:14px;border-radius:50%;flex:0 0 14px}
.seg{display:flex;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card2)}
.seg button{flex:1;border:0;border-radius:0;min-height:44px;white-space:nowrap;padding:0 8px;background:transparent;color:var(--text2)}
.seg button.on{background:var(--pri);color:var(--on-pri)}
.ing{display:grid;grid-template-columns:minmax(0,1fr) 92px 44px;gap:8px;align-items:center}
.ing button{padding:0}
.si{fill:var(--acc);flex:none}.sibig{display:flex;justify-content:center;padding:10px 0 2px}
.nrow{display:flex;align-items:center;gap:8px}
.ing.rz{grid-template-columns:minmax(0,1fr) 80px 96px}
.ing.note{grid-template-columns:minmax(0,1fr) 96px;padding:8px 0;border-top:1px solid var(--line,#2a2a28);border-bottom:1px solid var(--line,#2a2a28)}
.ing.note .nrow select{flex:1}
.ing .ctl{display:flex;gap:4px;justify-content:flex-end}.ing .ctl button{width:29px;min-width:0;height:38px;padding:0;font-size:13px}
.rnd button.on{color:var(--acc);border-color:var(--acc)}
table{width:100%;border-collapse:collapse}td,th{padding:10px 12px 10px 0;border-bottom:1px solid var(--line2);text-align:left;font-weight:400;vertical-align:top}
td:last-child,th:last-child{padding-right:0}.nw{white-space:nowrap}
th{font-size:13px;color:var(--mut)}td.r,th.r{text-align:right;white-space:nowrap}  /* Zahlen mit Einheit nie umbrechen */tr:last-child td{border-bottom:0}
.chart{display:flex;align-items:flex-end;gap:8px;height:96px}
.chart div{flex:1;background:var(--track);border-radius:5px 5px 0 0;min-height:3px}
.chart div.on{background:var(--acc)}
.chartl{display:flex;gap:8px}.chartl span{flex:1;text-align:center;font-size:12px;color:var(--mut)}
.info{background:var(--accbg);color:var(--acc);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--accbd)}
.info input{background:var(--card2);color:var(--text)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translateX(-50%);
background:var(--pri);color:var(--on-pri);padding:11px 18px;border-radius:14px;font-size:15px;font-weight:500;
opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;z-index:20}
.toast.on{opacity:1}
.stepper{display:flex;align-items:center;gap:10px}.stepper input{text-align:center;font-size:20px}
.stepper button{width:46px;padding:0;font-size:22px}
.foot{display:flex;justify-content:space-between;font-size:13px;color:var(--faint);margin-top:4px}
.col{display:flex;flex-direction:column;gap:12px}
.set .stepper{max-width:200px}.set .stepper input{width:80px}
.frow{display:flex;align-items:center;gap:12px;min-height:54px;border-bottom:1px solid var(--line2)}
.frow:last-child{border-bottom:0}
.fico{width:36px;height:36px;border-radius:12px;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;flex:0 0 36px;color:var(--mut)}
.fico.d{background:var(--accbg);color:var(--acc)}
.fname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fname a,.list a{color:var(--text);text-decoration:none}
.fsize{font-size:13px;color:var(--faint);white-space:nowrap}
.crumb{display:flex;flex-wrap:wrap;gap:6px;font-size:14px;color:var(--mut)}
.crumb a{color:var(--ui);text-decoration:none}
.swatch{display:flex;gap:8px;flex-wrap:wrap}
.swatch button{width:34px;height:34px;min-height:34px;padding:0;border-radius:50%;border:2px solid transparent}
.swatch button.on{border-color:var(--text);box-shadow:0 0 0 2px var(--bg) inset}
.hide{display:none!important}
</style>
</head>

<script>
"use strict";
// ============================================================
//  Zustand und Hilfen
// ============================================================
let S={g:0,gross:0,disp:"–",unit:"g",stable:false,over:false,pot:"",off:0,time:"",bat:-1,ble:false,max:3000};
let page=null, poll=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=(v,d=1)=>Number(v).toFixed(d).replace(".",",");
const COLORS=["#3DDC97","#F5B83D","#7FB2F0","#E88AB4"];
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),2000)}
// Der Webserver der Waage bedient immer nur eine Verbindung. Deshalb schicken
// wir Anfragen nacheinander statt parallel: das ist auf dem ESP32 deutlich
// schneller, weil sich die Anfragen sonst gegenseitig blockieren.
let AUTONEXT=true;  // Einstellung "Auto-Weiter" der Waage
let q=Promise.resolve(), busy=0;
function req(u,body){
 busy++;
 const run=()=>{const ac=new AbortController(),to=setTimeout(()=>ac.abort(),8000);
   return fetch(u,Object.assign({signal:ac.signal},body===undefined?{}:{method:"POST",
     body:typeof body=="string"?body:JSON.stringify(body)}))
    .then(r=>r.json()).catch(()=>({ok:0,msg:"keine Verbindung"})).finally(()=>clearTimeout(to))};
 const p=q.then(run,run);
 q=p.catch(()=>{}).then(()=>{busy--});
 return p}
function api(u,body){return req(u,body)}
// Textdatei holen, ebenfalls in der Warteschlange (der Server bedient nur eine Verbindung)
function getText(u){busy++;const run=()=>fetch(u).then(r=>r.ok?r.text():"").catch(()=>"");
 const p=q.then(run,run);q=p.catch(()=>{}).then(()=>{busy--});return p}
function get(u){return req(u)}
const SVG=(d,extra="")=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" ${extra}>${d}</svg>`;
// Strichsymbole (24er Raster), passend zu den Symbolen auf dem Display
const ICON={
 ziel:SVG('<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/>'),
 rezept:SVG('<rect x="4.5" y="3.5" width="15" height="17" rx="2.5"/><path d="M8 8h8M8 12h8M8 16h5"/>'),
 cocktail:SVG('<path d="M4 5h16l-8 8.5L4 5Z"/><path d="M12 13.5V19"/><path d="M8.5 19.5h7"/>'),
 spule:SVG('<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2"/>'),
 zaehlen:SVG('<path d="M9.5 4 8 20M16 4l-1.5 16M4.5 9h15M3.5 15h15"/>'),
 porto:SVG('<rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="m3.8 7 8.2 6 8.2-6"/>'),
 spiel:SVG('<rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="9" cy="9" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="15" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/>'),
 trink:SVG('<path d="M5.5 7.5h10v11a2 2 0 0 1-2 2h-6a2 2 0 0 1-2-2v-11Z"/><path d="M15.5 10h2.2a1.8 1.8 0 0 1 1.8 1.8v3.4a1.8 1.8 0 0 1-1.8 1.8h-2.2"/><path d="M5.5 11h10"/><path d="M6.5 7.5c0-1.7 1.6-2.6 2.8-2 .7-1.3 3-1.5 3.8-.2 1.3-.5 2.6.5 2.4 2.2"/>'),
 portion:SVG('<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5V12l6 6M12 12l-6 6"/>'),
 timer:SVG('<circle cx="12" cy="13" r="7.5"/><path d="M12 9v4l2.5 2M9.5 3h5M18.5 6.5l1.5-1.5"/>'),
 tassen:SVG('<path d="M5 8h11v7a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V8Z"/><path d="M16 10h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M8.5 3.5c0 1.2 1 1.3 1 2.5M12 3.5c0 1.2 1 1.3 1 2.5"/>'),
 mix:SVG('<path d="M5 4h5v12a2.5 2.5 0 0 1-5 0V4ZM14 4h5v12a2.5 2.5 0 0 1-5 0V4Z"/><path d="M5 11h5M14 13h5"/>'),

function head(title,back=true,right=""){return `<div class="hdr">${back?`<a class="back" href="#/" aria-label="Zurück">${ICON.zurueck}</a>`:'<span></span>'}<div class="t">${title}</div>${right||"<span></span>"}</div>`}
// Ringanzeige wie auf dem Display
function ring(pct,inner,color){const r=103,c=2*Math.PI*r,off=c*(1-Math.max(0,Math.min(1,pct)));
 return `<div class="ring"><svg viewBox="0 0 230 230"><circle class="tr" cx="115" cy="115" r="${r}"></circle>
 <circle class="in" cx="115" cy="115" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${off}" ${color?`style="stroke:${color}"`:""}></circle></svg>
 <div class="mid2">${inner}</div></div>`}
// Schalter im Stil des Displays
function swi(id,on){return `<span class="sw ${on?"on":""}" onclick="this.classList.toggle('on');$('${id}').checked=this.classList.contains('on')"><input type="checkbox" id="${id}" ${on?"checked":""}></span>`}
function stepper(id,val,step=1,min=0,max=99999){return `<div class="stepper"><button onclick="stepBy('${id}',-${step},${min},${max})">−</button><input id="${id}" type="number" value="${val}" inputmode="numeric"><button onclick="stepBy('${id}',${step},${min},${max})">+</button></div>`}
function stepBy(id,d,min,max){const e=$(id);let v=(+e.value||0)+d;e.value=Math.max(min,Math.min(max,v));e.dispatchEvent(new Event("input"))}
function statePill(){return S.over?'<span class="pill d">Überlast</span>':(S.stable?'<span class="pill">stabil</span>':'<span class="pill n">misst …</span>')}
function ls(k,v){if(v===undefined){try{return JSON.parse(localStorage.getItem("waage_"+k))}catch(e){return null}}try{localStorage.setItem("waage_"+k,JSON.stringify(v))}catch(e){}}

function tr(t){if(!LANG||typeof t!="string")return t;
 const m=t.match(/^(\s*)([\s\S]*?)(\s*)$/),core=m[2];if(!core)return t;
 let r=EN[core];
 if(r===undefined)for(const[re,rep]of ENP){const g=core.match(re);
  if(g){r=rep.replace(/T?\$(\d)/g,(x,k)=>{const v=g[k]||"";return x[0]=="T"?tr(v):v});break}}
 return r===undefined?t:m[1]+r+m[3]}
function trLines(t){return String(t).split("\n").map(tr).join("\n")}
function trNode(n){if(!LANG)return;
 if(n.nodeType==3){const p=n.parentElement;if(p&&p.closest("[translate=no],script,style"))return;
  const v=n.nodeValue,t=tr(v);if(t!==v)n.nodeValue=t;return}
 if(n.nodeType!=1||n.closest("[translate=no],script,style"))return;
 const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT),l=[];let x;while(x=w.nextNode())l.push(x);l.forEach(trNode);
 [n,...n.querySelectorAll("[placeholder],[title],[aria-label]")].forEach(e=>["placeholder","title","aria-label"].forEach(a=>{
  if(e.hasAttribute(a)&&!e.closest("[translate=no]")){const v=e.getAttribute(a),t=tr(v);if(t!==v)e.setAttribute(a,t)}}))}
new MutationObserver(ms=>{if(!LANG)return;for(const m of ms){if(m.type=="characterData")trNode(m.target);else m.addedNodes.forEach(trNode)}})
 .observe(document.body,{childList:true,subtree:true,characterData:true});

function setTheme(t){t=+t||0;if(t<0||t>=THEMES.length)t=0;if(t===curTheme)return;curTheme=t;const r=document.documentElement,c=THEMES[t];
 r.dataset.theme=t==1?"w":"";
 for(const k of["--acc","--on-acc","--acc2","--accbg","--accbd","--bar","--accsh"])r.style.removeProperty(k);
 if(c){const h=c[0],rgb=[0,2,4].map(i=>parseInt(h.substr(i,2),16)).join(",");
  r.style.setProperty("--acc","#"+h);r.style.setProperty("--on-acc","#"+c[1]);r.style.setProperty("--acc2","#"+c[2]);

const trk={done:false,since:0};
function trackReset(){trk.done=false;trk.since=0}
function track(g,note){if(Math.abs(g)<3){trackReset();return}if(trk.done||g<5)return;if(!S.stable){trk.since=0;return}
 if(!trk.since)trk.since=Date.now();if(Date.now()-trk.since<1500)return;trk.done=true;logAdd(g,note).then(()=>toast("Im Protokoll gespeichert"))}

const SI_KEYS=Object.keys(SI);
function siSvg(k,sz){const p=(SI[k]||SI.hinweis)[1];return `<svg class="si" viewBox="0 -960 960 960" width="${sz}" height="${sz}" aria-hidden="true"><path d="${p}"/></svg>`}
const siLabel=k=>(SI[k]||SI.hinweis)[0];
const isNote=z=>z&&z.k==1;
function mmss(s){s=Math.max(0,Math.round(s));const m=Math.floor(s/60),x=s%60;return m+":"+(x<10?"0":"")+x}
// Rezepte mit Eiern skalieren nach ganzen Eiern (EGG_G wie in config.h): Eier
// werden zuerst gewogen, danach richtet sich der Rest nach dem echten Eigewicht.
const EGG_G=55;
const isEgg=n=>/^(ei|eier|egg|eggs)$/i.test(String(n).trim());
P.rezept={list:[],rec:null,por:2,step:0,done:[],auto:true,egg:-1,eggs:1,eggBase:1,f:1,real:false,ord:[],tEnd:{},render(){
 return head("Rezept",true,this.rec?`<a class="act" href="#" onclick="P.rezept.pick();return false">Rezepte</a>`:"")+`<div class="col" id="rbody"><div class="card">Lade …</div></div>`},
 enter(){get("/api/recipes").then(l=>{this.list=l;this.pick()})},
 pick(){this.rec=null;park(0);
  $("rbody").innerHTML=this.list.length?`<div class="card list">${this.list.map((r,i)=>
   `<div class="it"><span><b>${esc(r.name)}</b><br><span class="faint">${r.count} Zutaten</span></span>
    <button class="sm p" onclick="P.rezept.open(${i})">Wählen</button></div>`).join("")}</div>`:
  `<div class="card">Noch keine Rezepte.<a class="btn p" href="#/rezepte">Rezept anlegen</a></div>`},
 open(i){get("/api/recipe?file="+encodeURIComponent(this.list[i].file)).then(r=>{this.rec=r;this.por=r.portions;
  this.egg=r.ing.findIndex(z=>!isNote(z)&&isEgg(z.name)&&z.grams>0);
  const rest=r.ing.map((z,k)=>k).filter(k=>k!==this.egg);
  this.ord=this.egg>=0?[this.egg,...rest]:rest;
  if(this.egg>=0){this.eggBase=Math.max(1,Math.round(r.ing[this.egg].grams/EGG_G));this.eggs=this.eggBase}
  this.tEnd={};this.plan();this.prev()})},
 // geplanter Faktor: ganze Eier oder Portionen
 plan(){this.f=this.egg>=0?this.eggs/this.eggBase:this.por/this.rec.portions;this.real=false},
 amount(i){const z=this.rec.ing[i];return isNote(z)?0:z.grams*this.f},
 cur(){return this.ord[this.step]},
 weighN(){return this.rec.ing.filter(z=>!isNote(z)).length},
 eggTxt(n){return n==1?"1 Ei":n+" Eier"},
 total(){return this.rec.ing.reduce((a,z,i)=>a+this.amount(i),0)},
 // kurze Bezeichnung eines Schritts (Liste, „danach …“)
 stepName(z){return isNote(z)?(z.text||siLabel(z.icon)):z.name},
 prev(){const r=this.rec;
  $("rbody").innerHTML=`<div class="card"><div class="top"><h2>${esc(r.name)}</h2><span class="mut" id="rt">${Math.round(this.total())} g gesamt</span></div>
   <div class="set"><span>${this.egg>=0?"Eier":"Portionen"}</span>${stepper("rp",this.egg>=0?this.eggs:this.por,1,1,20)}</div>
   <table>${this.ord.map((i,k)=>{const z=r.ing[i];return isNote(z)?
    `<tr class="note"><td class="faint" style="width:22px">${k+1}</td><td><span class="nrow">${siSvg(z.icon,22)}<span class="mut">${esc(this.stepName(z))}</span></span></td><td class="r faint">${z.sec?mmss(z.sec):""}</td></tr>`:
    `<tr><td class="faint" style="width:22px">${k+1}</td><td>${esc(z.name)}</td><td class="r" id="ra${i}"></td></tr>`}).join("")}</table>
   ${this.egg>=0?`<span class="faint">Die Eier wiegst du zuerst ab, der Rest richtet sich nach ihrem echten Gewicht.</span>`:""}
   <button class="p" onclick="P.rezept.begin()">Starten</button>
   <span class="faint">Nach jeder Zutat wird automatisch tariert.</span></div>`;
  const upd=()=>{r.ing.forEach((z,i)=>{if(!isNote(z))$("ra"+i).textContent=(i==this.egg?"ca. ":"")+Math.round(this.amount(i))+" g"});
   $("rt").textContent=Math.round(this.total())+" g gesamt"};
  $("rp").oninput=()=>{const n=Math.max(1,Math.min(20,+$("rp").value||1));
   if(this.egg>=0)this.eggs=n;else this.por=n;this.plan();upd()};
  upd()},
 begin(){this.step=0;this.done=[];this.plan();this.tEnd={};if(!isNote(this.rec.ing[this.cur()]))tare();this.show()},
 // Liste aller Schritte unter der aktuellen Anzeige
 steps(){const r=this.rec;return `<div class="card"><div class="top"><span class="mut">Schritte</span><span class="faint">${this.step+1} von ${r.ing.length}</span></div>
   <div class="list">${this.ord.map((i,k)=>{const x=r.ing[i];return `<div class="it" style="${k==this.step?"color:var(--acc)":(k<this.step?"":"opacity:.55")}">
    <span>${k<this.step?"✓":(k==this.step?"›":"–")} ${esc(this.stepName(x))}</span><span>${isNote(x)?(x.sec?mmss(x.sec):""):fmt(this.amount(i))+" g"}</span></div>`}).join("")}</div></div>`},
 show(){const r=this.rec,ci=this.cur(),z=r.ing[ci],nxt=r.ing[this.ord[this.step+1]];
  const then=nxt?" · danach "+esc(this.stepName(nxt)):"";
  const btns=extra=>`<div class="rnd">${extra}<button onclick="P.rezept.back()">Zurück</button>
   <button class="p" onclick="P.rezept.next()">${this.step+1>=r.ing.length?"Fertig":"Weiter"}</button></div>`;
  if(isNote(z)){park(0);  // Anweisung: Icon und Text statt Gewicht
   $("rbody").innerHTML=`<div class="card center">
    <span class="mut">Schritt ${this.step+1} von ${r.ing.length}</span>
    <div class="sibig">${siSvg(z.icon,112)}</div>
    <h2 style="font-size:22px;max-width:320px">${esc(z.text||siLabel(z.icon))}</h2>
    <span class="faint">${esc(siLabel(z.icon))}${then}</span>
    ${btns(z.sec?`<button id="rtm" onclick="P.rezept.timer()">Timer ${mmss(z.sec)}</button>`:"")}</div>`+this.steps();
   this.live();return}
  const goal=this.amount(ci),egg=ci==this.egg;
  park(egg?0:goal);  // Eier: kein Parkpiepser, sie sind nie „zu viel“
  $("rbody").innerHTML=`<div class="card center">
   <span class="mut">Schritt ${this.step+1} von ${r.ing.length}</span>
   <h2 style="font-size:24px">${esc(z.name)}</h2>
   ${ring(0,`<div class="big" id="rw">0<small>g</small></div><span class="pill" id="rr">–</span>`)}
   <span class="faint">${egg?this.eggTxt(this.eggs)+" aufschlagen · ca. "+fmt(goal)+" g":"Ziel "+fmt(goal)+" g"}${then}</span>
   ${this.real&&!egg?`<span class="faint">an ${Math.round(this.f*r.ing[this.egg].grams)} g Eier angepasst</span>`:""}
   ${btns('<button onclick="tare()">Tara</button>')}</div>`+this.steps()},
 // Küchentimer auf der Waage starten (klingelt dort auch, wenn diese Seite zu ist)
 timer(){const z=this.rec.ing[this.cur()],k=this.step;if(this.tEnd[k]>Date.now())return;
  get("/api/tools").then(d=>{const i=(d.timers||[]).findIndex(t=>!t.run);
   if(i<0){toast("Kein Timer frei");return}
   get("/api/timer?i="+i+"&s="+z.sec+"&name="+encodeURIComponent(tr(siLabel(z.icon)))).then(()=>{this.tEnd[k]=Date.now()+z.sec*1000;this.live()})})},
 next(){const z=this.rec.ing[this.cur()];this.done[this.step]=isNote(z)?0:S.g;
  // Eier gewogen: Rest nach dem echten Eigewicht (unter 10 g lag wohl nichts drauf)
  if(this.cur()==this.egg&&S.g>10){this.f=S.g/this.rec.ing[this.egg].grams;this.real=true}
  if(this.step+1>=this.rec.ing.length){this.finish();return}this.step++;
  if(!isNote(this.rec.ing[this.cur()]))tare();this.show()},
 back(){if(this.step==0||(this.step==1&&this.egg>=0))this.plan();
  if(this.step==0){park(0);this.prev();return}this.step--;
  if(!isNote(this.rec.ing[this.cur()]))tare();this.show()},
 finish(){park(0);const sum=this.done.reduce((a,b)=>a+b,0);logAdd(sum,"Rezept: "+this.rec.name);sound("done");
  $("rbody").innerHTML=`<div class="card center">${ring(1,`<div class="mid" style="color:var(--acc)">Fertig</div>`)}
   <h2>${esc(this.rec.name)}</h2>
   <span class="mut">${this.weighN()} Zutaten · ${this.egg>=0?this.eggTxt(this.eggs):this.por+" Portionen"} · ${fmt(sum)} g</span>
   <span class="faint">Eintrag steht im Protokoll.</span>
   <div class="btns"><button class="g" onclick="P.rezept.pick()">Rezepte</button><a class="btn p g" href="#/">Übersicht</a></div></div>`},
 leave(){park(0)},
 live(){if(!this.rec)return;const z=this.rec.ing[this.cur()];
  if(isNote(z)){const b=$("rtm");if(!b)return;const left=((this.tEnd[this.step]||0)-Date.now())/1000;
   b.textContent=left>0?mmss(left):"Timer "+mmss(z.sec);b.className=left>0?"on":"";return}
  if(!$("rw"))return;const egg=this.cur()==this.egg,goal=this.amount(this.cur()),g=S.g,tol=Math.max(.5,Math.min(2,goal*.05));
  $("rw").innerHTML=fmt(g)+"<small>g</small>";
  // Eier: nie „zu viel“, ab 80 % grün; kein Auto-Weiter (zwischen zwei Eiern liegt es auch ruhig)
  const over=!egg&&g>goal+tol,ok=egg?g>=goal*.8:g>=goal-tol;
  const col=over?"var(--dan)":(ok?"var(--acc)":"var(--text)");
  $("rw").style.color=col;
  const r=document.querySelector(".ring .in");
  if(r){const c=2*Math.PI*103;r.style.strokeDashoffset=c*(1-Math.max(0,Math.min(1,g/goal)));r.style.stroke=col}
  const pill=$("rr");
  if(egg){pill.textContent=g>10?"Rest wird angepasst":"–";pill.className=g>10?"pill":"pill n"}
  else if(over){pill.textContent=fmt(g-goal)+" g zu viel";pill.className="pill d"}
  else if(ok){pill.textContent="passt";pill.className="pill"}
  else{pill.textContent="noch "+fmt(goal-g)+" g";pill.className="pill n"}
  this.auto(!egg&&ok)},
 // erreicht und ruhig -> nach 1,2 s zur nächsten Zutat (Einstellung Auto-Weiter)
 auto(erreicht){if(!AUTONEXT||!erreicht||!S.stable){this.okSince=0;return}
  const now=Date.now();if(!this.okSince)this.okSince=now;
  if(now-this.okSince>1200){this.okSince=0;this.next()}}};

const MAT=[["PLA",1.24],["PETG",1.27],["ABS",1.04],["ASA",1.07],["TPU",1.21],["PC",1.20],["Nylon",1.14]];
P.spule={spools:[],render(){const m=ls("mat")||0,d=ls("diam")||1.75;
 return head("Spule")+`
 <div class="card center">${ring(0,`<div class="big" id="sl">0<small>m</small></div><span class="pill">Restfilament</span>`)}
 <table><tr><td>Auf der Waage</td><td class="r" id="sg">–</td></tr>
 <tr><td>Leerspule</td><td class="r" id="ssp">ohne</td></tr>
 <tr><td>Netto Filament</td><td class="r" id="sn">–</td></tr></table>
 <button onclick="P.spule.save()">Restmeter ins Protokoll</button></div>
 <div class="card"><div class="top"><span class="mut">Material</span><span class="mut" id="sd">${fmt(MAT[m][1],2)} g/cm³</span></div>
 <div class="chips" id="smc">${MAT.map((x,i)=>`<button class="chip ${i==m?"on":""}" onclick="P.spule.mat(${i})">${x[0]}</button>`).join("")}</div>
 <span class="mut">Durchmesser</span>
 <div class="seg" style="max-width:230px"><button id="d175" class="${d<2?"on":""}" onclick="P.spule.diam(1.75)">1,75 mm</button><button id="d285" class="${d>2?"on":""}" onclick="P.spule.diam(2.85)">2,85 mm</button></div></div>
 <div class="card"><span class="mut">Leerspule</span><div class="chips" id="ssc"></div>
 <span class="faint">Neue Leerspule anlegen: leere Spule auflegen, Namen eingeben.</span>
 <div class="btns"><input id="snew" placeholder="Hersteller oder Name"><button class="p" onclick="P.spule.add()">Anlegen</button></div>
 <span class="faint" id="scur"></span></div>`},
 enter(){trackReset();this.loadSpools()},
 loadSpools(){get("/api/pots").then(p=>{this.spools=p.spools;this.drawSpools()})},
 drawSpools(){const sel=ls("spool");if(!$("ssc"))return;
  $("ssc").innerHTML=`<button class="chip ${(sel==null||sel<0)?"on":""}" onclick="P.spule.pick(-1)">Ohne Leerspule</button>`+
   this.spools.map((x,i)=>`<button class="chip ${sel==i?"on":""}" onclick="P.spule.pick(${i})">${esc(x.name)} · ${Math.round(x.grams)} g</button>`).join("")},
 pick(i){ls("spool",i);this.drawSpools()},
 mat(i){ls("mat",i);$("smc").querySelectorAll("button").forEach((b,k)=>b.classList.toggle("on",k==i));$("sd").textContent=fmt(MAT[i][1],2)+" g/cm³"},
 diam(d){ls("diam",d);$("d175").classList.toggle("on",d<2);$("d285").classList.toggle("on",d>2)},
 spool(){const i=ls("spool");return i>=0&&this.spools[i]?this.spools[i]:null},
 net(){const sp=this.spool();return Math.max(0,S.g-(sp?sp.grams:0))},
 len(net){const d=ls("diam")||1.75,r=d/20,m=MAT[ls("mat")||0];return net/m[1]/(Math.PI*r*r)/100},
 live(){if(!$("sl"))return;const n=this.net(),sp=this.spool(),m=MAT[ls("mat")||0];
  track(n,"Spule "+m[0]+": "+Math.round(this.len(n))+" m");
  $("sl").innerHTML=Math.round(this.len(n))+"<small>m</small>";
  $("sg").textContent=fmt(S.g)+" g";
  $("ssp").textContent=sp?esc(sp.name)+" · "+fmt(sp.grams)+" g":"ohne";
  $("sn").textContent=fmt(n)+" g";
  $("scur").textContent="Aktuell auf der Waage: "+fmt(S.g)+" g";
  const r=document.querySelector(".ring .in");
  if(r){const c=2*Math.PI*103;r.style.strokeDashoffset=c*(1-Math.min(1,n/1000))}},
 save(){const n=this.net(),m=MAT[ls("mat")||0];
  logAdd(n,"Spule "+m[0]+": "+Math.round(this.len(n))+" m").then(()=>toast("Im Protokoll gespeichert"))},
 add(){const name=$("snew").value.trim();if(!name){toast("Bitte Namen eingeben");return}
  api("/api/spool_add",{name}).then(r=>{toast(r.ok?"Leerspule gespeichert":r.msg);if(r.ok){$("snew").value="";this.loadSpools()}})}};

P.zaehlen={render(){const pg=ls("piece")||0;
 return head("Zählen",true,`<span class="pill ${S.ble?"":"n"}" id="zb">${S.ble?"Bluetooth":"kein BT"}</span>`)+
 `<div class="card ${pg?"hide":""}" id="zref"><span class="mut">Referenz: so viele Teile liegen auf der Waage</span>

 <div class="card center ${pg?"":"hide"}" id="zrun"><div class="big" id="zc">–</div>
  <span class="mut" id="zi"></span><span class="faint" id="zw"></span>

 <div class="card ${pg?"":"hide"}" id="zlc"><div class="top"><span class="mut">Zählliste</span><span class="mut" id="zsum"></span></div>

 enter(){trackReset();this.draw()},

 live(){const pg=ls("piece");
  if($("zrg")){$("zrg").textContent=fmt(S.g)+" g";const n=+($("zn")?$("zn").value:10)||10;

 ref(){const n=+$("zn").value||10;if(!S.stable||S.g<.5){toast("Noch nicht stabil");return}
  ls("piece",S.g/n);sound("save");toast("Referenz übernommen");this.reload()},
 add(){if(!ls("piece")){toast("Erst Referenz übernehmen");return}const l=ls("zlist")||[];
  l.push({name:$("zl").value||"Position "+(l.length+1),n:this.count(),t:S.time});ls("zlist",l);$("zl").value="";this.draw()},
 draw(){if(!$("zlist"))return;const l=ls("zlist")||[];

  $("zsum").textContent=l.length+(l.length==1?" Position":" Positionen")},
 del(i){const l=ls("zlist")||[];l.splice(i,1);ls("zlist",l);this.draw()},

P.porto={cls:[],render(){return head("Porto",true,`<a class="act" href="#/portoklassen">Klassen</a>`)+`

 uebernehmen(){const z=this.rec.ing[this.row];if(!z)return;if(!S.stable){toast("Noch nicht stabil");return}
  z.grams=Math.max(1,Math.round(S.g/dens(z.name)));sound("save");this.editor()},
 save(){const r=this.rec;r.ing=r.ing.filter(z=>z.name.trim()&&z.grams>0);r.portions=1;

// ---------- Trinkspiel ----------
// Getränk abstellen -> trinken -> zurückstellen; die Waage misst den Schluck (1 g ≈ 1 ml)
P.trink={mode:0,rounds:5,st:"setup",names:["Spieler 1","Spieler 2","Spieler 3"],render(){return head("Trinkspiel")+`<div class="col" id="tb"></div>`},
 enter(){if(this.st!="setup"){this.turn();return}PL.load().then(()=>this.setup())},
 setup(){this.st="setup";get("/api/hide?on=0");
  $("tb").innerHTML=`<div class="card"><div class="seg"><button class="${this.mode==0?"on":""}" onclick="P.trink.mode=0;P.trink.setup()">Zielschluck</button><button class="${this.mode==1?"on":""}" onclick="P.trink.mode=1;P.trink.setup()">K.o.</button></div>
  <span class="mut">${this.mode==0?"Jede Runde gibt es ein Ziel in ml. Wer am Ende insgesamt am wenigsten daneben liegt, gewinnt.":"Wer weiter daneben liegt als die Toleranz, scheidet aus. Die Toleranz wird jede Runde kleiner."}</span>
  ${this.mode==0?`<div class="set"><span>Runden</span><div class="seg" style="width:190px">${[3,5,10].map(r=>`<button class="${r==this.rounds?"on":""}" onclick="P.trink.rounds=${r};P.trink.setup()">${r}</button>`).join("")}</div></div>`:""}</div>
  <div class="card"><div class="top"><h2>Mitspieler</h2><span class="mut">${PL.sel.length} gewählt</span></div>
  ${PL.chips("P.trink.setup()")}
  <span class="faint">Namen pflegst du einmal unter Einstellungen → Spielernamen.</span></div>
  <div class="card"><span class="faint">Ablauf: Getränk abstellen, trinken, zurückstellen – die Waage misst den Schluck. Waage vor dem Start leer lassen. Bitte verantwortungsvoll trinken.</span>
  <button class="p" onclick="P.trink.start()" ${PL.sel.length<2?"disabled":""}>Los</button></div>
  <div id="tboard"></div>`;
  PL.board("Trinkspiel","Bestenliste Trinkspiel").then(h=>{if($("tboard"))$("tboard").innerHTML=h})},
 start(){this.names=PL.sel.slice();const n=this.names.length;
  this.round=0;this.tol=15;this.dev=Array(n).fill(0);this.drunk=Array(n).fill(0);this.sip=Array(n).fill(0);this.out=Array(n).fill(false);this.outR=Array(n).fill(-1);
  tare();get("/api/hide?on=1");this.newTarget();this.player=this.next(0);this.turn()},
 newTarget(){this.target=10+Math.floor(Math.random()*15)*5},
 next(f){for(let i=f;i<this.names.length;i++)if(!this.out[i])return i;return -1},
 alive(){return this.out.filter(o=>!o).length},
 turn(){this.st="place";$("tb").innerHTML=`<div class="card center"><span class="mut">Runde ${this.round+1}${this.mode==0?" / "+this.rounds:""} · Ziel ${this.target} ml${this.mode==1?" · ±"+this.tol:""}</span>
  <h2 style="font-size:24px">${esc(this.names[this.player])}</h2><div class="mid" id="ts" style="color:var(--acc)">Getränk abstellen</div>
  <div class="big" id="tv" style="color:var(--faint)">${this.target}<small>ml</small></div><span class="mut" id="tsub">Ziel</span>
  <button class="p hide" id="tn" onclick="P.trink.nextTurn()">Weiter</button></div>`},
 live(){const g=S.g,st=S.stable;if(!$("ts"))return;
  if(this.st=="place"){$("ts").textContent="Getränk abstellen";if(st&&g>=20){this.before=g;this.st="drink";sound("tick")}}
  else if(this.st=="drink"){$("ts").textContent="Jetzt trinken!";if(g<10)this.st="back"}
  else if(this.st=="back"){$("ts").textContent="Zurückstellen";if(st&&g>=10){const sip=this.before-g;
   if(sip<1){toast("Nichts getrunken? Nochmal");this.before=g;this.st="drink";return}
   this.sip[this.player]=sip;this.drunk[this.player]+=sip;this.st="reveal";$("ts").textContent="Und …";sound("drum");setTimeout(()=>this.reveal(),1300)}}},
 reveal(){const sip=this.sip[this.player],dev=Math.abs(sip-this.target),hit=dev<=2;$("tv").innerHTML=Math.round(sip)+"<small>ml</small>";$("tv").style.color=hit?"var(--acc)":"";
  $("ts").textContent="Ergebnis";const sub=$("tsub");
  if(this.mode==1){const out=dev>this.tol;sub.textContent=Math.round(dev)+" ml daneben · "+(out?"raus!":"weiter");sub.style.color=out?"var(--dan)":"var(--acc)"}
  else{sub.textContent=(hit?"Volltreffer! ":"")+Math.round(dev)+" ml daneben";sub.style.color=hit?"var(--acc)":""}
  this.st="done";$("tn").classList.remove("hide")},
 nextTurn(){const nx=this.next(this.player+1);if(nx>=0){this.player=nx;this.turn()}else this.roundEnd()},
 roundEnd(){this.st="round";const n=this.names.length,alive=[...Array(n).keys()].filter(i=>!this.out[i]);let stay=0;
  alive.forEach(i=>{const d=Math.abs(this.sip[i]-this.target);this.dev[i]+=d;if(d<=this.tol)stay++});
  if(this.mode==1&&stay>0)alive.forEach(i=>{if(Math.abs(this.sip[i]-this.target)>this.tol){this.out[i]=true;this.outR[i]=this.round}});
  const end=this.mode==0?this.round+1>=this.rounds:this.alive()<=1;
  $("tb").innerHTML=`<div class="card"><h2>Runde ${this.round+1} · Ziel ${this.target} ml</h2><table>${alive.map(i=>{const d=Math.abs(this.sip[i]-this.target),o=this.outR[i]==this.round;
   return `<tr style="${o?"color:var(--dan)":""}"><td>${esc(this.names[i])}</td><td class="r">${Math.round(this.sip[i])} ml</td><td class="r">${Math.round(d)} daneben${o?" · raus":""}</td></tr>`}).join("")}</table>
   <button class="p" onclick="P.trink.${end?"board":"nextRound"}()">${end?"Endstand":"Nächste Runde"}</button></div>`},
 nextRound(){this.round++;if(this.mode==1)this.tol=Math.max(3,this.tol-3);this.newTarget();this.player=this.next(0);this.turn()},
 board(){this.st="setup";get("/api/hide?on=0");sound("done");const n=this.names.length;const idx=[...Array(n).keys()];
  idx.sort((a,b)=>this.mode==1?((this.out[b]?this.outR[b]:999)-(this.out[a]?this.outR[a]:999))||(this.dev[a]-this.dev[b]):this.dev[a]-this.dev[b]);
  api("/api/game",{line:new Date().toLocaleString("de-DE")+";Trinkspiel "+(this.mode?"KO":"Zielschluck")+";"+idx.map(i=>this.names[i]+":"+Math.round(this.drunk[i])+" ml getrunken").join(";")});
  this.names.forEach((n,i)=>api("/api/scores",{game:"Trinkspiel",name:n,value:Math.round(this.dev[i]*10)/10,unit:"ml"}));
  logAdd(this.dev[idx[0]],"Trinkspiel: Sieger "+this.names[idx[0]]);
  $("tb").innerHTML=`<div class="card center"><span class="mut">Sieg!</span><div class="mid" style="color:var(--acc)">${esc(this.names[idx[0]])}</div></div>
  <div class="card"><h2>Endstand</h2><table><thead><tr><th>Spieler</th><th class="r">${this.mode?"Status":"Summe daneben"}</th><th class="r">getrunken</th></tr></thead>
  ${idx.map((i,k)=>`<tr style="${k==0?"color:var(--acc);font-weight:600":""}"><td>${k+1}. ${esc(this.names[i])}</td><td class="r">${this.mode?(this.out[i]?"raus":"Sieg"):Math.round(this.dev[i])+" ml"}</td><td class="r">${Math.round(this.drunk[i])} ml</td></tr>`).join("")}</table>
  <button class="p" onclick="P.trink.setup()">Neues Spiel</button></div>`},
 leave(){if(this.st!="setup")get("/api/hide?on=0")}};

// ---------- Rezepte verwalten ----------
P.rezepte={list:[],rec:null,render(){return head("Rezepte")+`<div class="col" id="rl"></div><button class="p" onclick="P.rezepte.edit(null)">+ Neues Rezept</button><div class="col" id="re"></div>`},
 enter(){get("/api/recipes").then(l=>{this.list=l;$("rl").innerHTML=l.map((r,i)=>`<div class="card"><div class="top"><div><h2>${esc(r.name)}</h2><span class="mut">${r.count} Zutaten</span></div><button onclick="P.rezepte.edit(${i})">Bearbeiten</button></div></div>`).join("")})},
 edit(i){const go=r=>{this.rec=r;this.draw();$("re").scrollIntoView({behavior:"smooth"})};
  if(i===null)go({file:"",name:"",portions:2,ing:[{name:"",grams:100}]});else get("/api/recipe?file="+encodeURIComponent(this.list[i].file)).then(go)},
 // Zeile verschieben (d = -1 hoch, +1 runter)
 mv(i,d){const a=this.rec.ing,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];this.draw()},
 row(z,i){const R="P.rezepte.rec.ing["+i+"]",n=this.rec.ing.length;
  // ▲ ▼ × je Zeile: verschieben und löschen
  const ctl=`<span class="ctl"><button onclick="P.rezepte.mv(${i},-1)" ${i?"":"disabled"}>▲</button><button onclick="P.rezepte.mv(${i},1)" ${i<n-1?"":"disabled"}>▼</button><button class="d" onclick="P.rezepte.rec.ing.splice(${i},1);P.rezepte.draw()">×</button></span>`;
  // Anweisung zweizeilig: Icon + Art, darunter Text und Minuten
  if(isNote(z))return `<div class="ing note"><span class="nrow">${siSvg(z.icon,26)}<select onchange="${R}.icon=this.value;P.rezepte.draw()">${SI_KEYS.map(k=>`<option value="${k}" ${k==z.icon?"selected":""}>${siLabel(k)}</option>`).join("")}</select></span>${ctl}
   <input placeholder="Anweisung" maxlength="55" value="${esc(z.text||"")}" oninput="${R}.text=this.value">
   <input type="number" min="0" step="0.5" placeholder="min" value="${z.sec?+(z.sec/60).toFixed(1):""}" oninput="${R}.sec=Math.round((+this.value||0)*60)"></div>`;
  return `<div class="ing rz"><input placeholder="Zutat" value="${esc(z.name)}" oninput="${R}.name=this.value"><input type="number" value="${z.grams}" oninput="${R}.grams=+this.value">${ctl}</div>`},
 draw(){const r=this.rec;$("re").innerHTML=`<div class="card"><h2>${r.file?"Rezept bearbeiten":"Neues Rezept"}</h2>
  <input id="rn" placeholder="Name" value="${esc(r.name)}" oninput="P.rezepte.rec.name=this.value">
  <div class="set"><span>Portionen (Grundrezept)</span><input type="number" value="${r.portions}" style="max-width:90px" oninput="P.rezepte.rec.portions=+this.value"></div>
  <span class="mut">Schritte · Zutaten in g, Anweisungen mit Icon und optional Minuten (dann gibt es einen Timer)</span>
  ${r.ing.map((z,i)=>this.row(z,i)).join("")}
  <div class="btns"><button class="g" onclick="P.rezepte.rec.ing.push({name:'',grams:100});P.rezepte.draw()">+ Zutat</button>
  <button class="g" onclick="P.rezepte.rec.ing.push({k:1,icon:'ruehren',text:'',sec:0});P.rezepte.draw()">+ Anweisung</button></div>
  <div class="btns">${r.file?'<button class="d" onclick="P.rezepte.del()">Löschen</button>':''}<button class="p g" onclick="P.rezepte.save()">Speichern</button></div></div>`},
 save(){const r=this.rec,cut55=t=>{const e=new TextEncoder();while(e.encode(t).length>55)t=t.slice(0,-1);return t};
  // Anweisungen: { } [ ] ; würden das Dateiformat bzw. die Übertragung stören
  r.ing=r.ing.map(z=>isNote(z)?{k:1,icon:z.icon,text:cut55(String(z.text||"").replace(/[{\[]/g,"(").replace(/[}\]]/g,")").replace(/;/g,",").trim()),sec:z.sec||0}:z)
   .filter(z=>isNote(z)?true:(z.name.trim()&&z.grams>0));
  if(!r.name.trim()||!r.ing.some(z=>!isNote(z))){toast("Name und mindestens eine Zutat nötig");return}
  api("/api/recipe",r).then(x=>{toast(x.ok?"Gespeichert":"Fehler beim Speichern");$("re").innerHTML="";this.enter()})},
 del(){if(!confirm("Rezept löschen?"))return;get("/api/recipe/del?file="+encodeURIComponent(this.rec.file)).then(()=>{$("re").innerHTML="";this.enter()})}};

P.protokoll={days:[],i:0,render(){return head("Protokoll")+`<div class="top"><button onclick="P.protokoll.go(1)" aria-label="Vorheriger Tag">‹</button>
 <div class="center" style="display:flex;flex-direction:column;flex:1"><b id="pd" style="font:600 20px 'Space Grotesk',system-ui">–</b><span class="mut" id="pdi"></span></div>

 chart(){const map={};this.days.forEach(d=>map[d.day]=d.count);const base=this.days.length?new Date(this.days[0].day+"T12:00:00"):new Date();
  const cur=this.days[this.i]?this.days[this.i].day:"";const cols=[];for(let k=6;k>=0;k--){const t=new Date(base);t.setDate(t.getDate()-k);const key=t.toISOString().slice(0,10);cols.push([key,map[key]||0,t])}

P.akku={render(){return head("Akku")+`<div class="col" id="ab"><div class="card">Lade …</div></div>`},
 enter(){this.load();this.t=setInterval(()=>this.load(),30000)},

 load(){get("/api/battery").then(b=>{const st=b.state,farbe=st=="laedt"?"var(--warn)":(st=="voll"?"var(--acc)":(b.pct<20?"var(--dan)":"var(--acc)"));

  $("ab").innerHTML=`<div class="card center">${ring(usb?1:b.pct/100,

      <span class="pill ${st=="laedt"?"w":(st=="kein"?"n":"")}">${st=="laedt"?"lädt am USB":(st=="voll"?"voll geladen":(st=="kein"?"kein Akku":"Akkubetrieb"))}</span>`,farbe)}
   <span class="mut">${usb?"Ladestand erst ohne Kabel messbar":b.volts.toFixed(2).replace(".",",")+" V"+(b.left>0?" · noch ca. "+b.left.toFixed(1).replace(".",",")+" h":"")}</span></div>
   <div class="card"><div class="top"><span class="mut">Verlauf · ein Balken je ${iv} min</span><span class="mut">${b.per>0?b.per.toFixed(1).replace(".",",")+" %/h":"wird gemessen"}</span></div>
   <div style="position:relative;padding:0 0 18px 26px">${n?grid:""}

   <div style="display:flex;gap:3px;margin-top:4px">${n?xlab:""}</div></div>
   <span class="faint">Senkrecht: Ladestand in %, Zahl über dem Balken = Wert · Waagerecht: Stunden zurück</span></div>
   ${b.test?`<div class="card"><div class="top"><span class="mut">Entladetest</span><span class="pill w">läuft</span></div>
     <span class="mut">${b.test_h.toFixed(1).replace(".",",")} h · von ${b.test_v0.toFixed(2).replace(".",",")} auf ${b.volts.toFixed(2).replace(".",",")} V · ${b.test_n} Messpunkte</span>
     <button class="b d" onclick="get('/api/battery/test?on=0').then(()=>P.akku.load())">Test beenden</button></div>`
    :`<div class="card"><span class="mut">Entladetest</span><span class="faint">Misst einmal komplett durch, von voll bis zur Abschaltung, und schreibt jede Minute Spannung und Ladestand als CSV auf die SD-Karte. Daraus siehst du die echte Laufzeit.</span>
     <button class="b" onclick="get('/api/battery/test?on=1').then(()=>P.akku.load())">Entladetest starten</button></div>`}`})},

P.messung={files:[],cur:"",iv:ls("lt_iv")||60,render(){return head("Messungen",true,`<a class="act" href="#" onclick="P.messung.enter();return false">Neu laden</a>`)+

  :`<div class="card"><h2>Langzeitmessung</h2><span class="faint">Die Waage schreibt das Gewicht in festen Abständen als CSV auf die SD-Karte, auch wenn der Browser zu ist. Dabei schaltet sie sich nicht ab.</span>

   const rows=t.split(/\r?\n/).slice(1).map(l=>l.split(";")).filter(r=>r.length>=3)
    .map(r=>({clock:r[0],min:parseFloat(r[1].replace(",",".")),g:parseFloat(r[2].replace(",","."))})).filter(r=>!isNaN(r.min)&&!isNaN(r.g));
   this.draw(rows,path)})},
 draw(rows,path){const n=rows.length;if(!$("lb"))return;  // Seite inzwischen verlassen
  const list=`<div class="card"><span class="mut">Messung wählen</span><div class="chips" translate="no">${this.files.slice(0,12).map(f=>
   `<button class="chip ${f.name==this.cur?"on":""}" onclick="P.messung.pick('${esc(f.name)}')">${esc(f.name.replace(".csv",""))}</button>`).join("")}</div></div>`;
  if(n<2){$("lb").innerHTML=list+`<div class="card"><span class="mut">Noch zu wenige Werte.</span></div>`;return}
  const W=340,H=170,pl=44,pb=22;
  const lo=Math.min(...rows.map(r=>r.g)),hi=Math.max(...rows.map(r=>r.g)),span=Math.max(.5,hi-lo),mid=(hi+lo)/2;

  const yl=[hi,mid,lo].map(g=>`<text x="${pl-6}" y="${Y(g)+3}" font-size="10" fill="var(--faint)" text-anchor="end">${fmt(g,1)}</text>
   <line x1="${pl}" x2="${W-6}" y1="${Y(g)}" y2="${Y(g)}" stroke="var(--line)" stroke-dasharray="3 3"/>`).join("");
  // Trend: lineare Regression über alles, in g/h
  let sx=0,sy=0,sxx=0,sxy=0;rows.forEach(r=>{const x=r.min/60;sx+=x;sy+=r.g;sxx+=x*x;sxy+=x*r.g});
  const den=n*sxx-sx*sx,tr=den>1e-9?(n*sxy-sx*sy)/den:0,diff=rows[n-1].g-rows[0].g;
  $("lb").innerHTML=list+`<div class="card"><div class="top"><h2 translate="no">${esc(this.cur.replace(".csv",""))}</h2><span class="pill">${n} Werte</span></div>

   <table><tr><td>Dauer</td><td class="r">${fmt(hrs,1)} h</td></tr>
   <tr><td>Start · Ende</td><td class="r">${fmt(rows[0].g,1)} g · ${fmt(rows[n-1].g,1)} g</td></tr>
   <tr><td>Differenz</td><td class="r">${diff>=0?"+":""}${fmt(diff,1)} g</td></tr>
   <tr><td>Trend</td><td class="r">${tr>=0?"+":""}${fmt(tr,1)} g/h</td></tr>
   <tr><td>Kleinster · größter Wert</td><td class="r">${fmt(lo,1)} g · ${fmt(hi,1)} g</td></tr></table>
   <a class="btn" href="/file?path=${encodeURIComponent(path)}">CSV herunterladen</a></div>`},

// Gleicher Ablauf wie an der Waage: Normal auflegen, stabilisieren, abnehmen.
// Am Ende Cg und Cgk sowie CSV-Export der Einzelwerte.
P.msa={nom:500,tol:10,runs:25,vals:[],st:"setup",stableSince:0,last:null,
 render(){return head("Messmittelprüfung",true,this.st!="setup"?`<a class="act" href="#" onclick="P.msa.abort();return false">Abbrechen</a>`:"")+`<div class="col" id="mb"></div>`},
 enter(){this.st=="setup"?this.setup():this.runUi()},

 setup(){this.st="setup";$("mb").innerHTML=`<div class="card"><h2>Verfahren 1</h2>
  <span class="mut">Dasselbe Normal wird n-mal aufgelegt und abgenommen. Daraus berechnet die Waage Mittelwert, Bias, Standardabweichung, Cg und Cgk.</span>
  <div class="set"><span>Sollgewicht des Normals</span>${stepper("mn",this.nom,10,1,3000)}</div>
  <div class="set"><span>Toleranz T</span>${stepper("mt",this.tol,1,1,500)}</div>
  <div class="set"><span>Messungen</span><div class="seg" style="max-width:190px">${[25,50].map(r=>`<button class="${r==this.runs?"on":""}" onclick="P.msa.runs=${r};P.msa.setup()">${r}</button>`).join("")}</div></div>
  <button class="p" onclick="P.msa.start()">Prüfung starten</button>
  <span class="faint">Waage vor dem Start leeren. Der Wert wird übernommen, sobald das Gewicht ruhig liegt – oder von Hand über den Knopf.</span></div>`},
 start(){this.nom=+$("mn").value||500;this.tol=+$("mt").value||10;this.vals=[];this.st="place";this.stableSince=0;
  tare();$("app").innerHTML=this.render();this.runUi()},
 runUi(){$("mb").innerHTML=`<div class="card center"><span class="mut" id="mc">Messung 1 von ${this.runs}</span>
  <div class="big" id="mw">0,0<small>g</small></div>
  <span class="pill" id="mh">Normal auflegen</span>
  <button class="p" id="mtake" onclick="P.msa.take()">Wert übernehmen</button>
  <div class="bar"><div id="mp"></div></div>
  <span class="faint">Normal auflegen, ruhig werden lassen, übernehmen, abnehmen.</span></div>
  <div class="card"><div class="top"><span class="mut">Bisher erfasst</span><span class="mut" id="mn2">0</span></div>
  <div class="chips" id="mvals"><span class="faint">noch keine Werte</span></div></div>`},
 take(){const g=S.g;

  if(this.vals.length>=this.runs&&Math.abs(S.g)<2)this.result()},

  $("mc").textContent="Messung "+Math.min(n+1,this.runs)+" von "+this.runs;

  $("mn2").textContent=n+" von "+this.runs;

 live(){if(this.st=="setup"||!$("mw"))return;const g=S.g,now=Date.now(),h=$("mh"),b=$("mtake");
  $("mw").innerHTML=fmt(g)+"<small>g</small>";
  const drauf=g>=Math.max(5,this.nom*0.3), fertig=this.vals.length>=this.runs;
  if(this.st=="remove"){
   h.textContent=fertig?"fertig – bitte abnehmen":"Normal abnehmen";h.className="pill n";b.disabled=true;
   if(Math.abs(g)<2){if(fertig){this.result();return}this.st="place";this.stableSince=0}
   return}
  b.disabled=!drauf;
  if(!drauf){h.textContent="Normal auflegen";h.className="pill n";this.stableSince=0;return}
  if(!S.stable){h.textContent="stabilisieren …";h.className="pill w";this.stableSince=0;return}

 <span style="color:var(--warn);font-size:14px">Während des Updates die Waage nicht ausschalten und das WLAN nicht trennen.</span></div></div>`},
 // Online-Update von GitHub: Zustand der Waage abfragen, solange etwas läuft
 ota(q){get("/api/ota"+(q?"?"+q:"")).then(o=>{const e=$("fon");if(!e||!o||!o.ver)return;const st=o.state;
  const txt={idle:"Neue Version auf GitHub suchen",connect:"Verbinde mit WLAN …",check:"Suche Update …",latest:"Aktuell, nichts zu tun",
   available:"Neu: Version "+o.latest,download:"Lade … "+o.progress+" %",done:"Fertig, starte neu …",error:o.error}[st]||"";
  const busy=st=="connect"||st=="check"||st=="download";
  e.innerHTML=`<div class="top"><span class="mut">Online-Update</span><span class="pill ${st=="error"?"w":(st=="available"?"":"n")}">${o.local?"lokal gebaut":"Version "+esc(o.ver)}</span></div>
   <span class="${st=="available"?"":"mut"}" style="${st=="available"?"color:var(--acc)":""}">${esc(txt)}</span>
   ${st=="download"||st=="done"?`<div class="bar"><div style="width:${o.progress}%"></div></div>`:""}
   <span class="faint" translate="no">github.com/${esc(o.repo)}</span>
   ${busy||st=="done"?"":(st=="available"?`<button class="p" onclick="P.firmware.ota('install=1')">Installieren</button>`
     :`<button onclick="P.firmware.ota('check=1')">Online suchen</button>`)}
   <span class="faint">Die Waage lädt die neueste Version aus den GitHub-Releases und startet danach neu.</span>`;
  clearTimeout(this.t);if(busy||st=="done"||q)this.t=setTimeout(()=>{if(page===this)this.ota()},busy||q?1000:4000)})},
 leave(){clearTimeout(this.t)},
 enter(){this.ota();const el=$("fum");if(!el)return;
  el.parentElement.onclick=()=>{const on=!el.checked;el.checked=on;el.parentElement.classList.toggle("on",on);
   get("/api/update_mode?on="+(on?1:0)).then(r=>toast(on?"Update-Modus an – 15 Minuten":"Update-Modus aus"))}},
