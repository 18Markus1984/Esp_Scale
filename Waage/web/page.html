<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Waage</title>
<style>
/* Farben wie auf dem Display (ui_theme.h), damit Waage und Browser gleich aussehen */
:root{--bg:#0E0F0D;--card:#1E1F1B;--card2:#171815;--line:#2A2B26;--line2:#242520;--text:#F3F0E8;
--text2:#BDBAB0;--mut:#A6A398;--faint:#6F6D64;--acc:#3DDC97;--acc2:#2FB77C;--on-acc:#0B1F16;
--accbg:#14281F;--bar:#2FB77C;--warn:#F5B83D;--warnbg:#2A2214;--dan:#FF6B5E;--danbg:#2B1714;--track:#2A2B26}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
font:16px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 34px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font:600 24px/1.2 "Space Grotesk",system-ui,sans-serif}
h2{margin:0;font:600 17px/1.3 "Space Grotesk",system-ui,sans-serif}
/* Kopfzeile: runder Zurück-Knopf, Titel mittig, Aktion rechts */
.hdr{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;min-height:48px}
.hdr .t{text-align:center;font:600 20px/1.2 "Space Grotesk",system-ui,sans-serif}
.back{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);
color:var(--text);display:flex;align-items:center;justify-content:center;text-decoration:none;padding:0}
.back svg{display:block;width:22px;height:22px}
a.tile .ic svg{width:26px;height:26px;display:block}
a.chip svg{display:block;color:var(--acc)}
.act{color:var(--acc);text-decoration:none;font-size:15px;font-weight:500;padding:6px 2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{font-size:13px;padding:5px 11px;border-radius:14px;background:var(--accbg);color:var(--acc);white-space:nowrap}
.pill.w{background:var(--warnbg);color:var(--warn)}.pill.d{background:var(--danbg);color:var(--dan)}
.pill.n{background:var(--line);color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;
display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{background:var(--card2)}
.mut{color:var(--mut);font-size:14px}.faint{color:var(--faint);font-size:13px}
.big{font:500 54px/1 "Space Grotesk",system-ui,sans-serif;letter-spacing:-1px}
.big small{font-size:22px;color:var(--mut);letter-spacing:0;margin-left:6px}
.mid{font:500 28px/1.1 "Space Grotesk",system-ui,sans-serif}
.center{text-align:center;align-items:center}
/* Ringanzeige wie auf dem Display */
.ring{position:relative;width:230px;height:230px;margin:2px auto}
.ring svg{transform:rotate(-90deg);width:230px;height:230px;display:block}
.ring .tr{fill:none;stroke:var(--track);stroke-width:12}
.ring .in{fill:none;stroke:var(--acc);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .3s}
.ring .mid2{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.bar>div{height:8px;background:var(--acc);width:0;transition:width .3s}
.bar.over>div{background:var(--dan)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
button,.btn{min-height:46px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--card2);
color:var(--text);font-family:inherit;font-size:16px;font-weight:500;line-height:1;cursor:pointer;
display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
button.p,.btn.p{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
button.d{color:var(--dan)}button.g,.btn.g{flex:1}
button:disabled{opacity:.4}
button.sm,.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
/* runde Aktionsknöpfe wie am Gerät */
.rnd{display:flex;gap:14px;justify-content:center;align-items:center}
.rnd button{width:74px;height:74px;border-radius:50%;padding:0;font-size:15px}
.rnd button.p{box-shadow:0 6px 18px rgba(61,220,151,.18)}
input,select,textarea{min-height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;
font-family:inherit;font-size:16px;background:var(--card2);color:var(--text);width:100%;min-width:0}
select{-webkit-appearance:none;appearance:none;padding-right:34px;
background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);
background-position:calc(100% - 18px) 21px,calc(100% - 12px) 21px;background-size:6px 6px,6px 6px;background-repeat:no-repeat}
select option{background:#1E1F1B;color:#F3F0E8}
input[type=checkbox]{width:0;height:0;opacity:0;position:absolute}
input[type=range]{accent-color:var(--acc);min-height:28px;border:0;padding:0;background:transparent}
/* Schalter */
.sw{width:52px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:0 0 52px;cursor:pointer}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--faint);transition:.2s}
.sw.on{background:var(--accbg)}.sw.on:after{left:25px;background:var(--acc)}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:54px;border-bottom:1px solid var(--line2)}
.set:last-child{border-bottom:0}
.set>span:first-child{flex:1}.set input:not([type=checkbox]),.set select{width:auto;max-width:170px}
/* Kacheln und Chips */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
a.tile{text-decoration:none;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:7px;font-size:13px;text-align:center}
a.tile .ic{width:56px;height:56px;border-radius:18px;background:var(--card);border:1px solid var(--line);
display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--acc)}
a.tile:active .ic{background:var(--accbg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
a.chip,button.chip,span.chip{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:14px;
background:var(--card);border:1px solid var(--line);color:var(--text);text-decoration:none;font-size:14px;min-height:0}
button.chip.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.sec{font:600 15px/1.3 "Space Grotesk",system-ui,sans-serif;color:var(--text);margin:6px 2px -2px}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:50px;border-bottom:1px solid var(--line2)}
.list .it:last-child{border-bottom:0}
.dot{width:14px;height:14px;border-radius:50%;flex:0 0 14px}
.seg{display:flex;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card2)}
.seg button{flex:1;border:0;border-radius:0;min-height:44px;white-space:nowrap;padding:0 8px;background:transparent;color:var(--text2)}
.seg button.on{background:var(--acc);color:var(--on-acc)}
.ing{display:grid;grid-template-columns:minmax(0,1fr) 92px 44px;gap:8px;align-items:center}
.ing button{padding:0}
table{width:100%;border-collapse:collapse}td,th{padding:10px 12px 10px 0;border-bottom:1px solid var(--line2);text-align:left;font-weight:400;vertical-align:top}
td:last-child,th:last-child{padding-right:0}.nw{white-space:nowrap}
th{font-size:13px;color:var(--mut)}td.r,th.r{text-align:right;white-space:nowrap}  /* Zahlen mit Einheit nie umbrechen */tr:last-child td{border-bottom:0}
.chart{display:flex;align-items:flex-end;gap:8px;height:96px}
.chart div{flex:1;background:var(--track);border-radius:5px 5px 0 0;min-height:3px}
.chart div.on{background:var(--acc)}
.chartl{display:flex;gap:8px}.chartl span{flex:1;text-align:center;font-size:12px;color:var(--mut)}
.info{background:var(--accbg);color:var(--acc);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;border:1px solid #1E3B2C}
.info input{background:var(--card2);color:var(--text)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translateX(-50%);
background:var(--acc);color:var(--on-acc);padding:11px 18px;border-radius:14px;font-size:15px;font-weight:500;
opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;z-index:20}
.toast.on{opacity:1}
.stepper{display:flex;align-items:center;gap:10px}.stepper input{text-align:center;font-size:20px}
.stepper button{width:46px;padding:0;font-size:22px}
.foot{display:flex;justify-content:space-between;font-size:13px;color:var(--faint);margin-top:4px}
.col{display:flex;flex-direction:column;gap:12px}
.set .stepper{max-width:200px}.set .stepper input{width:80px}
.frow{display:flex;align-items:center;gap:12px;min-height:54px;border-bottom:1px solid var(--line2)}
.frow:last-child{border-bottom:0}
.fico{width:36px;height:36px;border-radius:12px;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;flex:0 0 36px;color:var(--mut)}
.fico.d{background:var(--accbg);color:var(--acc)}
.fname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fname a,.list a{color:var(--text);text-decoration:none}
.fsize{font-size:13px;color:var(--faint);white-space:nowrap}
.crumb{display:flex;flex-wrap:wrap;gap:6px;font-size:14px;color:var(--mut)}
.crumb a{color:var(--acc);text-decoration:none}
.swatch{display:flex;gap:8px;flex-wrap:wrap}
.swatch button{width:34px;height:34px;min-height:34px;padding:0;border-radius:50%;border:2px solid transparent}
.swatch button.on{border-color:var(--text);box-shadow:0 0 0 2px var(--bg) inset}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
// ============================================================
//  Zustand und Hilfen
// ============================================================
let S={g:0,gross:0,disp:"–",unit:"g",stable:false,over:false,pot:"",off:0,time:"",bat:-1,ble:false,max:3000};
let page=null, poll=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=(v,d=1)=>Number(v).toFixed(d).replace(".",",");
const COLORS=["#3DDC97","#F5B83D","#7FB2F0","#E88AB4"];
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),2000)}
// Der Webserver der Waage bedient immer nur eine Verbindung. Deshalb schicken
// wir Anfragen nacheinander statt parallel: das ist auf dem ESP32 deutlich
// schneller, weil sich die Anfragen sonst gegenseitig blockieren.
let AUTONEXT=true;  // Einstellung "Auto-Weiter" der Waage
let q=Promise.resolve(), busy=0;
function req(u,body){
 busy++;
 const run=()=>{const ac=new AbortController(),to=setTimeout(()=>ac.abort(),8000);
   return fetch(u,Object.assign({signal:ac.signal},body===undefined?{}:{method:"POST",
     body:typeof body=="string"?body:JSON.stringify(body)}))
    .then(r=>r.json()).catch(()=>({ok:0,msg:"keine Verbindung"})).finally(()=>clearTimeout(to))};
 const p=q.then(run,run);
 q=p.catch(()=>{}).then(()=>{busy--});
 return p}
function api(u,body){return req(u,body)}
// Textdatei holen, ebenfalls in der Warteschlange (der Server bedient nur eine Verbindung)
function getText(u){busy++;const run=()=>fetch(u).then(r=>r.ok?r.text():"").catch(()=>"");
 const p=q.then(run,run);q=p.catch(()=>{}).then(()=>{busy--});return p}
function get(u){return req(u)}
const SVG=(d,extra="")=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" ${extra}>${d}</svg>`;
// Strichsymbole (24er Raster), passend zu den Symbolen auf dem Display
const ICON={
 ziel:SVG('<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/>'),
 rezept:SVG('<rect x="4.5" y="3.5" width="15" height="17" rx="2.5"/><path d="M8 8h8M8 12h8M8 16h5"/>'),
 cocktail:SVG('<path d="M4 5h16l-8 8.5L4 5Z"/><path d="M12 13.5V19"/><path d="M8.5 19.5h7"/>'),
 spule:SVG('<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2"/>'),
 zaehlen:SVG('<path d="M9.5 4 8 20M16 4l-1.5 16M4.5 9h15M3.5 15h15"/>'),
 porto:SVG('<rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="m3.8 7 8.2 6 8.2-6"/>'),
 spiel:SVG('<rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="9" cy="9" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="15" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/>'),
 trink:SVG('<path d="M5.5 7.5h10v11a2 2 0 0 1-2 2h-6a2 2 0 0 1-2-2v-11Z"/><path d="M15.5 10h2.2a1.8 1.8 0 0 1 1.8 1.8v3.4a1.8 1.8 0 0 1-1.8 1.8h-2.2"/><path d="M5.5 11h10"/><path d="M6.5 7.5c0-1.7 1.6-2.6 2.8-2 .7-1.3 3-1.5 3.8-.2 1.3-.5 2.6.5 2.4 2.2"/>'),
 portion:SVG('<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5V12l6 6M12 12l-6 6"/>'),
 timer:SVG('<circle cx="12" cy="13" r="7.5"/><path d="M12 9v4l2.5 2M9.5 3h5M18.5 6.5l1.5-1.5"/>'),
 tassen:SVG('<path d="M5 8h11v7a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V8Z"/><path d="M16 10h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M8.5 3.5c0 1.2 1 1.3 1 2.5M12 3.5c0 1.2 1 1.3 1 2.5"/>'),
 mix:SVG('<path d="M5 4h5v12a2.5 2.5 0 0 1-5 0V4ZM14 4h5v12a2.5 2.5 0 0 1-5 0V4Z"/><path d="M5 11h5M14 13h5"/>'),
 langzeit:SVG('<path d="M3.5 19.5h17M3.5 4.5v15"/><path d="m6.5 15 4-5 3.5 3 5.5-7"/>'),
 muenzen:SVG('<ellipse cx="12" cy="7" rx="7" ry="3"/><path d="M5 7v5c0 1.7 3.1 3 7 3s7-1.3 7-3V7M5 12v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5"/>'),
 blind:SVG('<path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6Z"/><circle cx="12" cy="12" r="2.5"/><path d="M4.5 4.5l15 15"/>'),
 halb:SVG('<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17"/><path d="M12 3.5a8.5 8.5 0 0 0 0 17Z" fill="currentColor" stroke="none" opacity=".35"/>'),
 zurueck:SVG('<path d="m14.5 5-7 7 7 7"/>','style="width:22px;height:22px"'),
 chip:(d)=>SVG(d,'style="width:17px;height:17px"')};
function head(title,back=true,right=""){return `<div class="hdr">${back?`<a class="back" href="#/" aria-label="Zurück">${ICON.zurueck}</a>`:'<span></span>'}<div class="t">${title}</div>${right||"<span></span>"}</div>`}
// Ringanzeige wie auf dem Display
function ring(pct,inner,color){const r=103,c=2*Math.PI*r,off=c*(1-Math.max(0,Math.min(1,pct)));
 return `<div class="ring"><svg viewBox="0 0 230 230"><circle class="tr" cx="115" cy="115" r="${r}"></circle>
 <circle class="in" cx="115" cy="115" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${off}" ${color?`style="stroke:${color}"`:""}></circle></svg>
 <div class="mid2">${inner}</div></div>`}
// Schalter im Stil des Displays
function swi(id,on){return `<span class="sw ${on?"on":""}" onclick="this.classList.toggle('on');$('${id}').checked=this.classList.contains('on')"><input type="checkbox" id="${id}" ${on?"checked":""}></span>`}
function stepper(id,val,step=1,min=0,max=99999){return `<div class="stepper"><button onclick="stepBy('${id}',-${step},${min},${max})">−</button><input id="${id}" type="number" value="${val}" inputmode="numeric"><button onclick="stepBy('${id}',${step},${min},${max})">+</button></div>`}
function stepBy(id,d,min,max){const e=$(id);let v=(+e.value||0)+d;e.value=Math.max(min,Math.min(max,v));e.dispatchEvent(new Event("input"))}
function statePill(){return S.over?'<span class="pill d">Überlast</span>':(S.stable?'<span class="pill">stabil</span>':'<span class="pill n">misst …</span>')}
function ls(k,v){if(v===undefined){try{return JSON.parse(localStorage.getItem("waage_"+k))}catch(e){return null}}try{localStorage.setItem("waage_"+k,JSON.stringify(v))}catch(e){}}
// ============================================================
//  Sprache (Deutsch / English)
//  Die Seite ist auf Deutsch geschrieben. Ist English eingestellt,
//  übersetzt tr() jeden sichtbaren Text: erst über die Tabelle EN
//  (ganzer Text), sonst über die Muster ENP (Texte mit Zahlen oder
//  Namen; im Ersatz ist $1 die Gruppe, T$1 die übersetzte Gruppe).
//  Ein MutationObserver erledigt das für alles, was ins Dokument
//  kommt. Bereiche mit translate="no" bleiben unverändert.
//  Neuer Text: Zeile in EN ergänzen, fertig.
// ============================================================
let LANG=ls("lang")||0;  // 0 Deutsch, 1 English (maßgeblich ist die Einstellung der Waage)

function tr(t){if(!LANG||typeof t!="string")return t;
 const m=t.match(/^(\s*)([\s\S]*?)(\s*)$/),core=m[2];if(!core)return t;
 let r=EN[core];
 if(r===undefined)for(const[re,rep]of ENP){const g=core.match(re);
  if(g){r=rep.replace(/T?\$(\d)/g,(x,k)=>{const v=g[k]||"";return x[0]=="T"?tr(v):v});break}}
 return r===undefined?t:m[1]+r+m[3]}
function trLines(t){return String(t).split("\n").map(tr).join("\n")}
function trNode(n){if(!LANG)return;
 if(n.nodeType==3){const p=n.parentElement;if(p&&p.closest("[translate=no],script,style"))return;
  const v=n.nodeValue,t=tr(v);if(t!==v)n.nodeValue=t;return}
 if(n.nodeType!=1||n.closest("[translate=no],script,style"))return;
 const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT),l=[];let x;while(x=w.nextNode())l.push(x);l.forEach(trNode);
 [n,...n.querySelectorAll("[placeholder],[title],[aria-label]")].forEach(e=>["placeholder","title","aria-label"].forEach(a=>{
  if(e.hasAttribute(a)&&!e.closest("[translate=no]")){const v=e.getAttribute(a),t=tr(v);if(t!==v)e.setAttribute(a,t)}}))}
new MutationObserver(ms=>{if(!LANG)return;for(const m of ms){if(m.type=="characterData")trNode(m.target);else m.addedNodes.forEach(trNode)}})
 .observe(document.body,{childList:true,subtree:true,characterData:true});
{const c=window.confirm.bind(window),p=window.prompt.bind(window);
 window.confirm=m=>c(trLines(m));window.prompt=(m,d)=>p(tr(m),d)}

function tick(){
 if(busy>0)return;  // keine Zustandsabfrage dazwischenschieben
 req("/api/state").then(s=>{if(!s||s.g===undefined)return;S=s;if(page&&page.live)page.live();
  const f=$("foot");if(f)f.innerHTML=foot()})}
function foot(){const m=Math.floor(S.off/60),s=String(S.off%60).padStart(2,"0");return `<span>waage.local · aus in ${m}:${s}</span><span>${S.time||""}</span>`}

function logAdd(g,note){return get("/api/log_add?g="+g+"&note="+encodeURIComponent(tr(note||"")))}  // Notiz in der eingestellten Sprache
// Ergebnis der Modi einmal pro Auflegen ins Protokoll (wenn ruhig), wie an der Waage
const trk={done:false,since:0};
function trackReset(){trk.done=false;trk.since=0}
function track(g,note){if(Math.abs(g)<3){trackReset();return}if(trk.done||g<5)return;if(!S.stable){trk.since=0;return}
 if(!trk.since)trk.since=Date.now();if(Date.now()-trk.since<1500)return;trk.done=true;logAdd(g,note).then(()=>toast("Im Protokoll gespeichert"))}
function dl(name,text){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/plain"}));a.download=name;a.click()}

  const nxt=r.ing[this.step+1];

  const best={};
  rows.filter(r=>!game||r.game==game).forEach(r=>{
   const k=r.name+"|"+r.game;
   if(!best[k]||r.value<best[k].value)best[k]={name:r.name,game:r.game,value:r.value,unit:r.unit,day:r.day}});

  `<div class="card"><span class="mut">${titel}</span><span class="faint">Noch keine Ergebnisse gespeichert.</span></div>`)}};

// Rezepte in ml; gewogen wird in Gramm, umgerechnet über die Dichte der Zutat.
const DENS=[["sirup",1.28],["syrup",1.28],["honig",1.42],["likör",1.08],["likor",1.08],["baileys",1.05],["sahne",1.01],
 ["milch",1.03],["saft",1.05],["juice",1.05],["limette",1.03],["zitrone",1.03],["orange",1.05],["ananas",1.05],
 ["cola",1.04],["tonic",1.04],["ginger",1.04],["soda",1.0],["wasser",1.0],["eis",0.92],["wodka",0.95],["vodka",0.95],
 ["gin",0.94],["rum",0.94],["tequila",0.94],["whisk",0.94],["cachaca",0.94],["wermut",0.99],["vermouth",0.99],
 ["aperol",1.06],["campari",1.06],["sekt",0.99],["prosecco",0.99],["wein",0.99],["espresso",1.0]];

function glasSvg(fill,color){ // fill 0..1
 const y=170-120*Math.max(0,Math.min(1,fill));
 return `<svg viewBox="0 0 160 220" width="150" height="205" aria-hidden="true">
 <defs><clipPath id="cup"><path d="M30 50 L130 50 L88 150 L72 150 Z"/></clipPath></defs>
 <path d="M30 50 L130 50 L88 150 L72 150 Z" fill="#fff" stroke="#CFCABD" stroke-width="3"/>
 <g clip-path="url(#cup)"><rect x="20" y="${y}" width="120" height="200" fill="${color}" opacity=".85"/></g>
 <rect x="76" y="150" width="8" height="45" fill="#CFCABD"/><rect x="50" y="193" width="60" height="8" rx="4" fill="#CFCABD"/>
 </svg>`}
P.cocktail={list:[],rec:null,glasses:1,step:0,done:[],
 render(){return head("Cocktail",true,this.rec?`<a class="act" href="#" onclick="P.cocktail.pick();return false">Cocktails</a>`:"")+`<div class="col" id="cb"><div class="card">Lade …</div></div>`},
 enter(){trackReset();get("/api/recipes?dir=cocktails").then(l=>{this.list=l;this.pick()})},
 pick(){this.rec=null;park(0);
  $("cb").innerHTML=this.list.length?`<div class="card list">${this.list.map((r,i)=>
   `<div class="it"><span><b>${esc(r.name)}</b><br><span class="faint">${r.count} Zutaten</span></span>
    <button class="sm p" onclick="P.cocktail.open(${i})">Mixen</button></div>`).join("")}</div>`:
   `<div class="card">Keine Cocktails auf der Karte.<a class="btn p" href="#/cocktails">Cocktail anlegen</a></div>`},
 open(i){get("/api/recipe?dir=cocktails&file="+encodeURIComponent(this.list[i].file)).then(r=>{this.rec=r;this.glasses=1;this.prev()})},
 ml(i){return this.rec.ing[i].grams*this.glasses/(this.rec.portions||1)},
 goal(i){return this.ml(i)*dens(this.rec.ing[i].name)},

 prev(){const r=this.rec;
  $("cb").innerHTML=`<div class="card center">${glasLayers(r.ing.map((z,i)=>({name:z.name,ml:this.ml(i)})),this.total())}
   <span class="mut" id="cg2">${Math.round(this.total())} ml im Glas</span></div>
   <div class="card"><div class="top"><h2>${esc(r.name)}</h2><span class="mut">in Milliliter</span></div>

   <div class="list">${r.ing.map((z,i)=>`<div class="it"><span><span class="dot" style="background:${farbe(z.name)};display:inline-block;margin-right:8px"></span>${esc(z.name)}</span>
    <span id="cm${i}">${Math.round(this.ml(i))} ml · ${fmt(this.goal(i))} g</span></div>`).join("")}</div>

   <span class="faint">Die Waage rechnet Milliliter über die Dichte in Gramm um.</span></div>`;

   <span class="pill" id="cs">eingießen</span>
   <span class="faint">Ziel ${Math.round(this.ml(this.step))} ml (${fmt(goal)} g, Dichte ${fmt(dens(z.name),2)})</span>
   <div class="rnd"><button onclick="tare()">Tara</button><button onclick="P.cocktail.back()">Zurück</button>
   <button class="p" onclick="P.cocktail.next()">${this.step+1>=this.rec.ing.length?"Fertig":"Weiter"}</button></div></div>
   <div class="card"><div class="list">${this.rec.ing.map((x,i)=>`<div class="it" style="${i==this.step?"color:var(--acc)":(i<this.step?"":"opacity:.55")}">
    <span><span class="dot" style="background:${farbe(x.name)};display:inline-block;margin-right:8px"></span>${esc(x.name)}</span>

 next(){this.done[this.step]=S.g;if(this.step+1>=this.rec.ing.length){this.finish();return}this.step++;tare();this.show()},
 back(){if(this.step==0){park(0);this.prev();return}this.step--;tare();this.show()},

  let ml=0;this.done.forEach((x,i)=>ml+=x/dens(this.rec.ing[i].name));

  $("cb").innerHTML=`<div class="card center">${glasLayers(this.rec.ing.map((z,i)=>({name:z.name,ml:this.ml(i)})),this.total())}
   <div class="mid" style="color:var(--acc)">Fertig gemixt</div><h2>${esc(this.rec.name)}</h2>
   <span class="mut">${Math.round(ml)} ml · ${this.glasses} ${this.glasses>1?"Gläser":"Glas"}</span>
   <span class="faint">Eintrag steht im Protokoll.</span>

 live(){if(!this.rec||!$("cv"))return;const z=this.rec.ing[this.step],d=dens(z.name),soll=this.ml(this.step),ml=S.g/d;
  const tol=Math.max(1,soll*0.03);

  $("cv").style.color=col;
  const p=$("cs");

  this.auto(state>0)},
 // erreicht (oder leicht darüber) und ruhig -> automatisch weiter
 auto(erreicht){if(!AUTONEXT||!erreicht||!S.stable){this.okSince=0;return}
  const now=Date.now();if(!this.okSince)this.okSince=now;
  if(now-this.okSince>1200){this.okSince=0;this.next()}},
 leave(){park(0)}};

const ZUTATEN=["Gin","Wodka","Rum weiß","Rum braun","Tequila","Whisky","Cachaca","Aperol","Campari","Wermut",
 "Triple Sec","Kokoslikör","Kaffeelikör","Pfirsichlikör","Prosecco","Tonic Water","Cola","Ginger Beer","Ginger Ale","Soda",
 "Orangensaft","Ananassaft","Maracujasaft","Cranberrysaft","Limettensaft","Zitronensaft","Zuckersirup",
 "Grenadine","Holundersirup","Sahne","Milch","Espresso","Minzblätter","Eiswürfel"];
const FARBEN=[["cola","#4A2C17"],["rum braun","#8A4B1E"],["whisk","#B8701F"],["aperol","#F26B1D"],
 ["campari","#C42B2B"],["grenadine","#C0264B"],["cranberry","#B0284A"],["orangensaft","#F2A03D"],
 ["maracuja","#F0B02A"],["ananas","#F3D046"],["ginger","#D9A441"],["kaffee","#3B2415"],
 ["espresso","#3B2415"],["sahne","#F3EDE0"],["milch","#F3EDE0"],["kokos","#F1E7D6"],
 ["prosecco","#EFDD9B"],["sekt","#EFDD9B"],["wermut","#C9A15A"],["sirup","#D98CA8"],
 ["limette","#8FC95B"],["zitrone","#E4E057"],["minz","#6FBF73"],["eis","#DDEAF2"],
 ["tonic","#CFE3EA"],["soda","#CFE3EA"],["wasser","#CFE3EA"]];
function farbe(n){n=(n||"").toLowerCase();for(const[k,c]of FARBEN)if(n.includes(k))return c;return "#8C8778"}
// Glas mit farbigen Schichten je Zutat (von unten nach oben gefüllt)
function glasLayers(items,total){
 const top=50,boden=150,H=boden-top;let y=boden,parts="";
 items.forEach(it=>{const ml=(it.ml!==undefined?it.ml:it.grams)||0;const h=total>0?H*ml/total:0;y-=h;
  parts+=`<rect x="20" y="${y}" width="120" height="${h+0.5}" fill="${farbe(it.name)}"/>`});
 return `<svg viewBox="0 0 160 215" width="150" height="200" aria-hidden="true">
 <defs><clipPath id="cup2"><path d="M30 ${top} L130 ${top} L88 150 L72 150 Z"/></clipPath></defs>
 <path d="M30 ${top} L130 ${top} L88 150 L72 150 Z" fill="#14150F" stroke="#4A4A44" stroke-width="3"/>
 <g clip-path="url(#cup2)">${parts}</g>
 <rect x="76" y="150" width="8" height="45" fill="#4A4A44"/><rect x="50" y="193" width="60" height="8" rx="4" fill="#4A4A44"/></svg>`}

P.cocktails={list:[],rec:null,row:0,
 render(){return head("Cocktailkarte",true,this.rec?"":`<a class="act" href="#" onclick="P.cocktails.neu();return false">+ Neu</a>`)+`<div class="col" id="kb"></div>`},

  $("kb").innerHTML=(this.list.length?`<div class="card list">${this.list.map((r,i)=>

 neu(){this.rec={file:"",name:"",portions:1,ing:[{name:"",grams:40},{name:"",grams:100}]};this.editor()},
 total(){return this.rec.ing.reduce((a,z)=>a+(+z.grams||0),0)},

  <div class="card"><input id="kn" placeholder="Name des Cocktails" value="${esc(r.name)}" oninput="P.cocktails.rec.name=this.value">

  <div class="btns"><button class="g" onclick="tare()">Tara</button><button class="p g" onclick="P.cocktails.uebernehmen()">In Zeile ${this.row+1} übernehmen</button></div></div>
  <div class="btns">${r.file?'<button class="d g" onclick="P.cocktails.del()">Löschen</button>':''}
  <button class="g" onclick="P.cocktails.rec=null;P.cocktails.enter()">Abbrechen</button>
  <button class="p g" onclick="P.cocktails.save()">Speichern</button></div>
  <datalist id="kl">${ZUTATEN.map(z=>`<option value="${esc(tr(z))}">`).join("")}</datalist>`;
  $("kz").innerHTML=r.ing.map((z,i)=>`<div class="ing" style="grid-template-columns:18px minmax(0,1fr) 88px 44px;align-items:center">
   <span class="dot" style="background:${farbe(z.name)}"></span>
   <input list="kl" placeholder="Zutat" value="${esc(z.name)}" onfocus="P.cocktails.row=${i}" oninput="P.cocktails.rec.ing[${i}].name=this.value;P.cocktails.refresh()">
   <input type="number" inputmode="numeric" value="${z.grams}" onfocus="P.cocktails.row=${i}" oninput="P.cocktails.rec.ing[${i}].grams=+this.value;P.cocktails.refresh()">

 refresh(){const items=this.rec.ing.filter(z=>z.grams>0),tot=this.total(),c=$("kb").firstElementChild;
  if(c)c.innerHTML=glasLayers(items,tot)+`<span class="mut">${Math.round(tot)} ml im Glas</span>`;
  this.rec.ing.forEach((z,i)=>{const d=$("kz").children[i];if(d)d.firstElementChild.style.background=farbe(z.name)})},
 live(){const e=$("kw");if(!e)return;const z=this.rec&&this.rec.ing[this.row];const d=z?dens(z.name):1;
  e.textContent=Math.round(S.g/d)+" ml"+(S.stable?"":" …")},
 uebernehmen(){const z=this.rec.ing[this.row];if(!z)return;if(!S.stable){toast("Noch nicht stabil");return}
  z.grams=Math.max(1,Math.round(S.g/dens(z.name)));sound("save");this.editor()},
 save(){const r=this.rec;r.ing=r.ing.filter(z=>z.name.trim()&&z.grams>0);r.portions=1;
  if(!r.name.trim()||!r.ing.length){toast("Name und mindestens eine Zutat nötig");return}
  api("/api/recipe?dir=cocktails",r).then(x=>{toast(x.ok?"Gespeichert":"Fehler beim Speichern");this.rec=null;
   $("app").innerHTML=this.render();this.enter()})},
 del(){if(!confirm("Cocktail löschen?"))return;

// ---------- Trinkspiel ----------
// Getränk abstellen -> trinken -> zurückstellen; die Waage misst den Schluck (1 g ≈ 1 ml)
P.trink={mode:0,rounds:5,st:"setup",names:["Spieler 1","Spieler 2","Spieler 3"],render(){return head("Trinkspiel")+`<div class="col" id="tb"></div>`},
 enter(){if(this.st!="setup"){this.turn();return}PL.load().then(()=>this.setup())},
 setup(){this.st="setup";get("/api/hide?on=0");
  $("tb").innerHTML=`<div class="card"><div class="seg"><button class="${this.mode==0?"on":""}" onclick="P.trink.mode=0;P.trink.setup()">Zielschluck</button><button class="${this.mode==1?"on":""}" onclick="P.trink.mode=1;P.trink.setup()">K.o.</button></div>
  <span class="mut">${this.mode==0?"Jede Runde gibt es ein Ziel in ml. Wer am Ende insgesamt am wenigsten daneben liegt, gewinnt.":"Wer weiter daneben liegt als die Toleranz, scheidet aus. Die Toleranz wird jede Runde kleiner."}</span>
  ${this.mode==0?`<div class="set"><span>Runden</span><div class="seg" style="width:190px">${[3,5,10].map(r=>`<button class="${r==this.rounds?"on":""}" onclick="P.trink.rounds=${r};P.trink.setup()">${r}</button>`).join("")}</div></div>`:""}</div>
  <div class="card"><div class="top"><h2>Mitspieler</h2><span class="mut">${PL.sel.length} gewählt</span></div>
  ${PL.chips("P.trink.setup()")}
  <span class="faint">Namen pflegst du einmal unter Einstellungen → Spielernamen.</span></div>
  <div class="card"><span class="faint">Ablauf: Getränk abstellen, trinken, zurückstellen – die Waage misst den Schluck. Waage vor dem Start leer lassen. Bitte verantwortungsvoll trinken.</span>
  <button class="p" onclick="P.trink.start()" ${PL.sel.length<2?"disabled":""}>Los</button></div>
  <div id="tboard"></div>`;
  PL.board("Trinkspiel","Bestenliste Trinkspiel").then(h=>{if($("tboard"))$("tboard").innerHTML=h})},
 start(){this.names=PL.sel.slice();const n=this.names.length;
  this.round=0;this.tol=15;this.dev=Array(n).fill(0);this.drunk=Array(n).fill(0);this.sip=Array(n).fill(0);this.out=Array(n).fill(false);this.outR=Array(n).fill(-1);
  tare();get("/api/hide?on=1");this.newTarget();this.player=this.next(0);this.turn()},
 newTarget(){this.target=10+Math.floor(Math.random()*15)*5},
 next(f){for(let i=f;i<this.names.length;i++)if(!this.out[i])return i;return -1},
 alive(){return this.out.filter(o=>!o).length},
 turn(){this.st="place";$("tb").innerHTML=`<div class="card center"><span class="mut">Runde ${this.round+1}${this.mode==0?" / "+this.rounds:""} · Ziel ${this.target} ml${this.mode==1?" · ±"+this.tol:""}</span>
  <h2 style="font-size:24px">${esc(this.names[this.player])}</h2><div class="mid" id="ts" style="color:var(--acc)">Getränk abstellen</div>
  <div class="big" id="tv" style="color:var(--faint)">${this.target}<small>ml</small></div><span class="mut" id="tsub">Ziel</span>
  <button class="p hide" id="tn" onclick="P.trink.nextTurn()">Weiter</button></div>`},
 live(){const g=S.g,st=S.stable;if(!$("ts"))return;
  if(this.st=="place"){$("ts").textContent="Getränk abstellen";if(st&&g>=20){this.before=g;this.st="drink";sound("tick")}}
  else if(this.st=="drink"){$("ts").textContent="Jetzt trinken!";if(g<10)this.st="back"}
  else if(this.st=="back"){$("ts").textContent="Zurückstellen";if(st&&g>=10){const sip=this.before-g;
   if(sip<1){toast("Nichts getrunken? Nochmal");this.before=g;this.st="drink";return}
   this.sip[this.player]=sip;this.drunk[this.player]+=sip;this.st="reveal";$("ts").textContent="Und …";sound("drum");setTimeout(()=>this.reveal(),1300)}}},
 reveal(){const sip=this.sip[this.player],dev=Math.abs(sip-this.target),hit=dev<=2;$("tv").innerHTML=Math.round(sip)+"<small>ml</small>";$("tv").style.color=hit?"var(--acc)":"";
  $("ts").textContent="Ergebnis";const sub=$("tsub");
  if(this.mode==1){const out=dev>this.tol;sub.textContent=Math.round(dev)+" ml daneben · "+(out?"raus!":"weiter");sub.style.color=out?"var(--dan)":"var(--acc)"}
  else{sub.textContent=(hit?"Volltreffer! ":"")+Math.round(dev)+" ml daneben";sub.style.color=hit?"var(--acc)":""}
  this.st="done";$("tn").classList.remove("hide")},
 nextTurn(){const nx=this.next(this.player+1);if(nx>=0){this.player=nx;this.turn()}else this.roundEnd()},
 roundEnd(){this.st="round";const n=this.names.length,alive=[...Array(n).keys()].filter(i=>!this.out[i]);let stay=0;
  alive.forEach(i=>{const d=Math.abs(this.sip[i]-this.target);this.dev[i]+=d;if(d<=this.tol)stay++});
  if(this.mode==1&&stay>0)alive.forEach(i=>{if(Math.abs(this.sip[i]-this.target)>this.tol){this.out[i]=true;this.outR[i]=this.round}});
  const end=this.mode==0?this.round+1>=this.rounds:this.alive()<=1;
  $("tb").innerHTML=`<div class="card"><h2>Runde ${this.round+1} · Ziel ${this.target} ml</h2><table>${alive.map(i=>{const d=Math.abs(this.sip[i]-this.target),o=this.outR[i]==this.round;
   return `<tr style="${o?"color:var(--dan)":""}"><td>${esc(this.names[i])}</td><td class="r">${Math.round(this.sip[i])} ml</td><td class="r">${Math.round(d)} daneben${o?" · raus":""}</td></tr>`}).join("")}</table>
   <button class="p" onclick="P.trink.${end?"board":"nextRound"}()">${end?"Endstand":"Nächste Runde"}</button></div>`},
 nextRound(){this.round++;if(this.mode==1)this.tol=Math.max(3,this.tol-3);this.newTarget();this.player=this.next(0);this.turn()},
 board(){this.st="setup";get("/api/hide?on=0");sound("done");const n=this.names.length;const idx=[...Array(n).keys()];
  idx.sort((a,b)=>this.mode==1?((this.out[b]?this.outR[b]:999)-(this.out[a]?this.outR[a]:999))||(this.dev[a]-this.dev[b]):this.dev[a]-this.dev[b]);
  api("/api/game",{line:new Date().toLocaleString("de-DE")+";Trinkspiel "+(this.mode?"KO":"Zielschluck")+";"+idx.map(i=>this.names[i]+":"+Math.round(this.drunk[i])+" ml getrunken").join(";")});
  this.names.forEach((n,i)=>api("/api/scores",{game:"Trinkspiel",name:n,value:Math.round(this.dev[i]*10)/10,unit:"ml"}));
  logAdd(this.dev[idx[0]],"Trinkspiel: Sieger "+this.names[idx[0]]);
  $("tb").innerHTML=`<div class="card center"><span class="mut">Sieg!</span><div class="mid" style="color:var(--acc)">${esc(this.names[idx[0]])}</div></div>
  <div class="card"><h2>Endstand</h2><table><thead><tr><th>Spieler</th><th class="r">${this.mode?"Status":"Summe daneben"}</th><th class="r">getrunken</th></tr></thead>
  ${idx.map((i,k)=>`<tr style="${k==0?"color:var(--acc);font-weight:600":""}"><td>${k+1}. ${esc(this.names[i])}</td><td class="r">${this.mode?(this.out[i]?"raus":"Sieg"):Math.round(this.dev[i])+" ml"}</td><td class="r">${Math.round(this.drunk[i])} ml</td></tr>`).join("")}</table>
  <button class="p" onclick="P.trink.setup()">Neues Spiel</button></div>`},
 leave(){if(this.st!="setup")get("/api/hide?on=0")}};

P.protokoll={days:[],i:0,render(){return head("Protokoll")+`<div class="top"><button onclick="P.protokoll.go(1)" aria-label="Vorheriger Tag">‹</button>

P.msa={nom:500,tol:10,runs:25,vals:[],st:"setup",stableSince:0,last:null,
 render(){return head("Messmittelprüfung",true,this.st!="setup"?`<a class="act" href="#" onclick="P.msa.abort();return false">Abbrechen</a>`:"")+`<div class="col" id="mb"></div>`},

 setup(){this.st="setup";$("mb").innerHTML=`<div class="card"><h2>Verfahren 1</h2>
  <span class="mut">Dasselbe Normal wird n-mal aufgelegt und abgenommen. Daraus berechnet die Waage Mittelwert, Bias, Standardabweichung, Cg und Cgk.</span>
  <div class="set"><span>Sollgewicht des Normals</span>${stepper("mn",this.nom,10,1,3000)}</div>
  <div class="set"><span>Toleranz T</span>${stepper("mt",this.tol,1,1,500)}</div>
  <div class="set"><span>Messungen</span><div class="seg" style="max-width:190px">${[25,50].map(r=>`<button class="${r==this.runs?"on":""}" onclick="P.msa.runs=${r};P.msa.setup()">${r}</button>`).join("")}</div></div>
  <button class="p" onclick="P.msa.start()">Prüfung starten</button>
  <span class="faint">Waage vor dem Start leeren. Der Wert wird übernommen, sobald das Gewicht ruhig liegt – oder von Hand über den Knopf.</span></div>`},
 start(){this.nom=+$("mn").value||500;this.tol=+$("mt").value||10;this.vals=[];this.st="place";this.stableSince=0;
  tare();$("app").innerHTML=this.render();this.runUi()},
 runUi(){$("mb").innerHTML=`<div class="card center"><span class="mut" id="mc">Messung 1 von ${this.runs}</span>
  <div class="big" id="mw">0,0<small>g</small></div>
  <span class="pill" id="mh">Normal auflegen</span>
  <button class="p" id="mtake" onclick="P.msa.take()">Wert übernehmen</button>
  <div class="bar"><div id="mp"></div></div>
  <span class="faint">Normal auflegen, ruhig werden lassen, übernehmen, abnehmen.</span></div>
  <div class="card"><div class="top"><span class="mut">Bisher erfasst</span><span class="mut" id="mn2">0</span></div>
  <div class="chips" id="mvals"><span class="faint">noch keine Werte</span></div></div>`},
 take(){const g=S.g;
  if(g<Math.max(5,this.nom*0.3)){toast("Erst das Normal auflegen");return}

  if(this.vals.length>=this.runs&&Math.abs(S.g)<2)this.result()},

  $("mc").textContent="Messung "+Math.min(n+1,this.runs)+" von "+this.runs;

  $("mn2").textContent=n+" von "+this.runs;

  $("mw").innerHTML=fmt(g)+"<small>g</small>";
  const drauf=g>=Math.max(5,this.nom*0.3), fertig=this.vals.length>=this.runs;
  if(this.st=="remove"){
   h.textContent=fertig?"fertig – bitte abnehmen":"Normal abnehmen";h.className="pill n";b.disabled=true;
   if(Math.abs(g)<2){if(fertig){this.result();return}this.st="place";this.stableSince=0}
   return}
  b.disabled=!drauf;
  if(!drauf){h.textContent="Normal auflegen";h.className="pill n";this.stableSince=0;return}
  if(!S.stable){h.textContent="stabilisieren …";h.className="pill w";this.stableSince=0;return}

   <div class="card"><span class="mut">Einzelwerte</span><div class="chips">${v.map((x,i)=>`<span class="chip">${i+1}: ${f(x,1)}</span>`).join("")}</div></div></div>`;
  logAdd(mean,"Messmittel Cg "+f(cg)+" Cgk "+f(cgk))},
 setup2(){$("app").innerHTML=this.render();this.setup()},

  let t="Messmittelfaehigkeit Verfahren 1\nSollwert;"+this.nom+";g\nToleranz T;"+this.tol+";g\n";

// Ring in einem Bereich setzen (pct 0..1)
function setRing(box,pct,color){const r=document.querySelector(box+" .ring .in"),c=2*Math.PI*103;
 if(!r)return;r.style.strokeDashoffset=c*(1-Math.max(0,Math.min(1,pct)));if(color)r.style.stroke=color}
// 75 -> "1:15", 3725 -> "1:02:05"
function tfmt(s){s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s/60)%60,x=String(s%60).padStart(2,"0");
 return h?h+":"+String(m).padStart(2,"0")+":"+x:m+":"+x}
// "+4,2 g" / "−12 g"
function devTxt(d){const a=Math.abs(d);return (d<0?"−":"+")+(a>=10?Math.round(a):fmt(a,1))+" g"}
// Bedingung liegt ruhig ms lang an (für die Spiele)
function held(o,cond,ms=1000){if(!cond||!S.stable){o.since=0;return false}if(!o.since)o.since=Date.now();return Date.now()-o.since>=ms}

P.portion={st:"setup",count:ls("portion_n")||12,total:0,pieces:[],ready:false,on:false,last:0,since:0,
 render(){return head("Portionieren")+`<div class="col" id="pob"></div>`},
 enter(){this.st=="run"?this.runUi():(this.st=="result"?this.result():this.setup())},
 setup(){this.st="setup";park(0);
  $("pob").innerHTML=`<div class="card center"><span class="mut">Ganzes auflegen</span><div class="big" id="pow">0,0<small>g</small></div>
  <span class="pill n" id="poe">–</span></div>
  <div class="card"><div class="set"><span>Stückzahl</span>${stepper("pon",this.count,1,2,60)}</div>
  <div class="chips">${[4,6,8,10,12,16,20].map(n=>`<button class="chip" onclick="$('pon').value=${n};P.portion.cnt()">${n}</button>`).join("")}</div>
  <div class="btns"><button class="g" onclick="tare()">Tara</button><button class="p g" id="pogo" onclick="P.portion.start()" disabled>Weiter</button></div>
  <span class="faint">Schüssel vorher tarieren. Danach die Waage leeren und die Stücke einzeln auflegen. Das Soll jedes Stücks wird aus dem Rest neu berechnet.</span></div>`;
  $("pon").oninput=()=>this.cnt()},
 cnt(){this.count=Math.max(2,Math.min(60,+$("pon").value||2));ls("portion_n",this.count)},
 start(){if(!(S.stable&&S.g>3))return;this.cnt();this.total=S.g;this.pieces=[];this.ready=false;this.on=false;this.last=0;this.since=0;
  this.st="run";sound("save");$("app").innerHTML=this.render();this.runUi()},
 target(){const sum=this.pieces.reduce((a,b)=>a+b,0),left=this.count-this.pieces.length;return left>0?(this.total-sum)/left:0},
 runUi(){$("pob").innerHTML=`<div class="card center"><span class="mut" id="pot">–</span>
  ${ring(0,`<div class="big" id="pow">–</div><span class="pill n" id="pod">Waage leeren</span>`)}
  <span class="faint" id="pos"></span>
  <div class="rnd"><button onclick="P.portion.tara()">Tara</button><button class="p" onclick="P.portion.finish()">Fertig</button></div></div>
  <div class="card"><span class="mut">Bisher</span><div class="chips" id="pol"><span class="faint">noch leer</span></div></div>`;this.texts()},

 texts(){const t=this.target(),sum=this.pieces.reduce((a,b)=>a+b,0),last=this.pieces.length+1==this.count;
  $("pot").textContent="Stück "+(this.pieces.length+1)+" / "+this.count;
  $("pos").textContent=last?"Ziel "+fmt(t,1)+" g · letztes Stück":"Ziel "+fmt(t,1)+" g · Rest "+fmt(this.total-sum,1)+" g";
  $("pol").innerHTML=this.pieces.length?this.pieces.map((p,i)=>`<span class="chip">${i+1}: ${fmt(p,1)} g</span>`).join(""):'<span class="faint">noch leer</span>';
  if(this.ready)park(t)},
 live(){if(this.st=="setup"&&$("pow")){$("pow").innerHTML=`${fmt(S.g,1)}<small>g</small>`;
   $("poe").textContent=S.g>3?"je Stück "+fmt(S.g/this.count,1)+" g":"Ganzes auflegen";$("pogo").disabled=!(S.stable&&S.g>3&&!S.over);return}
  if(this.st!="run"||!$("pow"))return;const g=S.g,d=$("pod");
  if(!this.ready){$("pow").textContent="–";d.textContent="Waage leeren";d.className="pill n";
   if(Math.abs(S.gross)<5&&S.stable){tare();this.ready=true;this.texts()}return}
  const t=this.target(),tol=Math.max(1,t*.02);$("pow").textContent=fmt(g,1);
  if(g<3){if(this.on&&this.last>3){this.pieces.push(this.last);sound("save");this.on=false;this.last=0;
    if(this.pieces.length>=this.count){this.finish();return}this.texts()}
   d.textContent="Stück auflegen";d.className="pill n";this.since=0;setRing("#pob",0);return}
  this.on=true;const dv=g-t,st=dv<-tol?0:(dv<=tol?1:2);
  d.textContent=st==1?"passt":devTxt(dv);d.className="pill"+(st==1?"":(st==2?" d":" w"));
  setRing("#pob",g/t,st==2?"var(--dan)":(st==1?"var(--acc)":"var(--warn)"));
  if(S.stable){if(!this.since)this.since=Date.now();if(Date.now()-this.since>=600)this.last=g}else this.since=0},
 finish(){park(0);if(!this.pieces.length){this.st="setup";$("app").innerHTML=this.render();this.setup();return}this.st="result";$("app").innerHTML=this.render();this.result(true)},
 result(fresh){const p=this.pieces,n=p.length,sum=p.reduce((a,b)=>a+b,0),m=sum/n,lo=Math.min(...p),hi=Math.max(...p),
  sd=n>1?Math.sqrt(p.reduce((a,b)=>a+(b-m)*(b-m),0)/(n-1)):0;
  if(fresh){sound("done");logAdd(sum,"Portionen: "+n+" × "+fmt(m,1)+" g")}
  $("pob").innerHTML=`<div class="card center"><span class="mut">Fertig portioniert</span><div class="big">${n}<small>Stück</small></div>

  <tr><td>Streuung s</td><td class="r">${fmt(sd,1)} g</td></tr><tr><td>Summe</td><td class="r">${fmt(sum,1)} g</td></tr></table>
  <div class="chips">${p.map((x,i)=>`<span class="chip">${i+1}: ${fmt(x,1)} g</span>`).join("")}</div>

// 1 Tasse (US cup) = 236,6 ml, 1 EL = 1/16 Tasse, 1 TL = 1/48 Tasse. Gramm je Tasse: übliche Küchenwerte.
const CUPS=[["Mehl",125],["Zucker",200],["Puderzucker",120],["Brauner Zucker",213],["Butter",227],["Milch",240],["Wasser",237],
 ["Öl",218],["Honig",340],["Reis",185],["Haferflocken",90],["Kakao",85],["Nüsse gehackt",120],["Schokotropfen",170]];
function cupFrac(c){const q=Math.round(c*4),w=Math.floor(q/4),r=q%4,F=["","¼","½","¾"];return w&&r?w+" "+F[r]:(w?String(w):(r?F[r]:"0"))}
P.tassen={i:ls("cup_i")||0,goal:0,

  <div class="card"><span class="mut">Zutat</span><div class="chips">${CUPS.map((c,k)=>`<button class="chip ${k==this.i?"on":""}" onclick="P.tassen.pick(${k})">${c[0]}</button>`).join("")}</div>

  <div class="card center" id="tab">${ring(0,`<div class="mid" id="tac" style="font-size:23px;max-width:180px;text-align:center">–</div><span class="pill n" id="tas">Zutat auflegen</span><span class="mut" id="taw"></span>`)}
  <div class="set" style="width:100%"><span>Ziel in Tassen</span><div class="stepper"><button onclick="P.tassen.step(-1)">−</button><span class="mid" id="tgl" style="min-width:80px;text-align:center">aus</span><button onclick="P.tassen.step(1)">+</button></div></div>
  <span class="pill n hide" id="tar"></span>
  <div class="rnd"><button class="p" onclick="tare()">Tara</button></div></div>
  <span class="faint">Für amerikanische Rezepte: 1 Tasse = 236,6 ml, 1 EL = 1/16 Tasse, 1 TL = 1/48 Tasse. Gramm je Tasse locker eingefüllt.</span></div>`},
 enter(){this.showGoal()},

  park(this.goal?this.goal/4*CUPS[this.i][1]:0)},

  $("tac").textContent=c>0&&c<.125?"unter 1/8 Tasse":"ca. "+cupFrac(Math.max(0,c))+" Tassen";

  const el=c*16,tl=c*48;$("tas").textContent=g<.5?"Zutat auflegen":(el<1?"= "+fmt(tl,1)+" TL":"= "+fmt(el,1)+" EL · "+Math.round(tl)+" TL");
  $("tas").className=g<.5?"pill n":"pill";
  if(this.goal){const goal=this.goal/4*gc,tol=Math.max(1,goal*.02),d=goal-g,st=d>tol?0:(d>=-tol?1:2);
   $("tar").textContent=st==0?"noch "+fmt(d,1)+" g":(st==1?"passt":fmt(-d,1)+" g zu viel");$("tar").className="pill"+(st==1?"":(st==2?" d":" n"));

const COINS=[["2 €",200,8.5],["1 €",100,7.5],["50 ct",50,7.8],["20 ct",20,5.74],["10 ct",10,4.1],["5 ct",5,3.92],["2 ct",2,3.06],["1 ct",1,2.3]];

  <span class="faint">${fmt(COINS[this.i][2],2)} g je Münze · immer nur eine Sorte auf einmal</span></div>
  <div class="card center"><div class="big" id="mzn">0<small>Stück</small></div><div class="mid" style="color:var(--acc)" id="mzv">= 0,00 €</div>
  <span class="mut" id="mzi"></span>
  <div class="btns" style="width:100%"><button class="g" onclick="tare()">Tara</button><button class="p g" id="mza" onclick="P.muenzen.add()" disabled>+ Summe</button></div></div>
  <div class="card"><div class="top"><h2>Kassensturz</h2><span class="mid" style="font-size:22px">${eur(this.sum)}</span></div>

  <button class="d" onclick="P.muenzen.clear()">Summe löschen</button></div></div>`},

  $("mzi").textContent=fmt(S.g,1)+" g"+(n>0&&fr>.3?" · unsicher, Sorte prüfen":"");$("mza").disabled=!(n>0&&S.stable)},
 add(){const n=this.n(),c=COINS[this.i];if(!n||!S.stable)return;const v=n*c[1];this.sum+=v;this.rows.push({n,c:c[0],v});

 // Mehrere WLAN-Netze: die Waage nimmt das stärkste gespeicherte Netz in Reichweite
 wlan(){get("/api/wlan").then(w=>{const box=$("wl");if(!box)return;const nets=w.nets||[];
  box.innerHTML=`<span class="faint">Die Waage verbindet sich mit dem stärksten gespeicherten Netz in Reichweite. Bis zu ${w.max||5} Netze.</span>
  ${nets.length?nets.map((n,i)=>`<div class="set"><span><b style="font-weight:500">${esc(n)}</b>${n===w.cur?`<br><span class="faint">zuletzt verbunden</span>`:""}</span>
   <button class="sm" onclick="P.einstellungen.wdel(${i})">Entfernen</button></div>`).join(""):`<div class="set"><span class="mut">Kein Netzwerk gespeichert</span></div>`}
  <div class="set" style="flex-direction:column;align-items:stretch;gap:8px;padding:12px 0"><b style="font-weight:500">Netz hinzufügen</b>
   <input id="w_ssid" style="width:100%;max-width:none" maxlength="32" placeholder="Netzwerkname (SSID)" autocomplete="off">
   <input id="w_pass" style="width:100%;max-width:none" type="password" maxlength="64" placeholder="Passwort (leer bei offenem Netz)" autocomplete="new-password">
   <button onclick="P.einstellungen.wadd()">Hinzufügen</button>
   <span class="faint">Die aktuelle Verbindung bleibt bestehen. Das neue Netz wird beim nächsten Verbinden genutzt, zum Beispiel an einem anderen Ort.</span></div>`})},
 wadd(){const ss=$("w_ssid").value.trim(),pw=$("w_pass").value;
  if(!ss){toast("Bitte Namen eingeben");return}
  api("/api/wlan",{ssid:ss,pass:pw}).then(r=>{toast(r.ok?"Gespeichert":(r.msg||"Fehler"));if(r.ok)this.wlan()})},
 wdel(i){if(!confirm("Netz entfernen?"))return;get("/api/wlan/del?i="+i).then(r=>{toast(r.ok?"Gelöscht":"Fehler");this.wlan()})},
 // Prüfgewicht: letzte Prüfung, nächster Termin, Verlauf als CSV
 refInfo(s){if(!(s.ref_g>0))return `<span class="faint">Prüfgewicht ist aus.</span>`;
  const dev=s.ref_meas-s.ref_g;
  const last=s.ref_last?`<span class="${s.ref_ok?"mut":""}" style="${s.ref_ok?"":"color:var(--warn)"}">Zuletzt ${s.ref_last}: ${fmt(s.ref_meas,2)} g (${dev<0?"−":"+"}${fmt(Math.abs(dev),2)} g) ${s.ref_ok?"OK":"außer Toleranz"}</span>`
   :`<span class="mut">Noch nicht geprüft</span>`;
  const due=s.ref_due?`<span class="pill w" style="align-self:flex-start">Prüfung fällig</span>`:(s.ref_next?`<span class="faint">Nächste Prüfung ${s.ref_next}</span>`:"");
  return last+due+`<span class="faint">Prüfen an der Waage: Setup → Waage → Prüfgewicht · <a class="act" href="/file?path=%2FWaage%2FPruefung%2Fpruefgewicht.csv">Verlauf (CSV)</a></span>`},
 // Sprache sofort umstellen (Waage und Browser), die Seite neu aufbauen
 lang(l){get("/api/lang?l="+l).then(r=>{if(!r.ok){toast("Fehler");return}setLang(l);route()})},
 save(test){const v=id=>$(id),s={unit:this.pick.unit,autosave:v("s_autosave").checked,autonext:v("s_autonext").checked,idle:+v("s_idle").value,autooff:+v("s_autooff").value,autotara:v("s_autotara").checked,precise:v("s_precise").checked,ref_g:+String(v("s_refg").value).replace(",",".")||0,ref_days:+v("s_refd").value,ref_tol:+v("s_reft").value,liquid:+v("s_liquid").value,azt:v("s_azt").checked,
  cd:+v("s_cd").value,tol:+v("s_tol").value,vol:+v("s_vol").value,scheme:this.pick.scheme,speak:v("s_speak").checked,voice:this.pick.voice,porto:this.s.porto};
  api("/api/settings",s).then(()=>{toast("Gespeichert");if(test)get("/api/speak_test")})}};

// ============================================================
//  Router
// ============================================================
function route(){const key=(location.hash.replace(/^#\/?/,"")||"");const next=P[key]||P[""];
 if(page&&page!==next&&page.leave)page.leave();page=next;
 document.title=tr((key?(next.title||key.charAt(0).toUpperCase()+key.slice(1))+" · ":"")+"Waage");
 $("app").innerHTML=next.render();if(next.enter)next.enter();if(next.live)next.live();window.scrollTo(0,0)}
window.addEventListener("hashchange",route);
setLang(LANG);
get("/api/settings").then(s=>{if(s&&s.autonext!==undefined)AUTONEXT=!!s.autonext;
 if(s&&s.lang!==undefined&&(s.lang?1:0)!==LANG){setLang(s.lang);route()}});  // Sprache der Waage übernehmen
route();tick();poll=setInterval(tick,600);
</script>
</body>
</html>
