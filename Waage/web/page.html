// ============================================================
//  Neue Modi (wie an der Waage): Portionieren, Timer, Tassen & Löffel,
//  2K mischen, Münzen, Blindgießen, Halbe-Halbe
// ============================================================
// Ring in einem Bereich setzen (pct 0..1)
function setRing(box,pct,color){const r=document.querySelector(box+" .ring .in"),c=2*Math.PI*103;
 if(!r)return;r.style.strokeDashoffset=c*(1-Math.max(0,Math.min(1,pct)));if(color)r.style.stroke=color}
// 75 -> "1:15", 3725 -> "1:02:05"
function tfmt(s){s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s/60)%60,x=String(s%60).padStart(2,"0");
 return h?h+":"+String(m).padStart(2,"0")+":"+x:m+":"+x}
// "+4,2 g" / "−12 g"
function devTxt(d){const a=Math.abs(d);return (d<0?"−":"+")+(a>=10?Math.round(a):fmt(a,1))+" g"}
// Bedingung liegt ruhig ms lang an (für die Spiele)
function held(o,cond,ms=1000){if(!cond||!S.stable){o.since=0;return false}if(!o.since)o.since=Date.now();return Date.now()-o.since>=ms}

// ---------- Portionieren ----------
P.portion={st:"setup",count:ls("portion_n")||12,total:0,pieces:[],ready:false,on:false,last:0,since:0,
 render(){return head("Portionieren")+`<div class="col" id="pob"></div>`},
 enter(){this.st=="run"?this.runUi():(this.st=="result"?this.result():this.setup())},
 setup(){this.st="setup";park(0);
  $("pob").innerHTML=`<div class="card center"><span class="mut">Ganzes auflegen</span><div class="big" id="pow">0,0<small>g</small></div>
  <span class="pill n" id="poe">–</span></div>
  <div class="card"><div class="set"><span>Stückzahl</span>${stepper("pon",this.count,1,2,60)}</div>
  <div class="chips">${[4,6,8,10,12,16,20].map(n=>`<button class="chip" onclick="$('pon').value=${n};P.portion.cnt()">${n}</button>`).join("")}</div>
  <div class="btns"><button class="g" onclick="tare()">Tara</button><button class="p g" id="pogo" onclick="P.portion.start()" disabled>Weiter</button></div>
  <span class="faint">Schüssel vorher tarieren. Danach die Waage leeren und die Stücke einzeln auflegen. Das Soll jedes Stücks wird aus dem Rest neu berechnet.</span></div>`;
  $("pon").oninput=()=>this.cnt()},
 cnt(){this.count=Math.max(2,Math.min(60,+$("pon").value||2));ls("portion_n",this.count)},
 start(){if(!(S.stable&&S.g>3))return;this.cnt();this.total=S.g;this.pieces=[];this.ready=false;this.on=false;this.last=0;this.since=0;
  this.st="run";sound("save");$("app").innerHTML=this.render();this.runUi()},
 target(){const sum=this.pieces.reduce((a,b)=>a+b,0),left=this.count-this.pieces.length;return left>0?(this.total-sum)/left:0},
 runUi(){$("pob").innerHTML=`<div class="card center"><span class="mut" id="pot">–</span>
  ${ring(0,`<div class="big" id="pow">–</div><span class="pill n" id="pod">Waage leeren</span>`)}
  <span class="faint" id="pos"></span>
  <div class="rnd"><button onclick="P.portion.tara()">Tara</button><button class="p" onclick="P.portion.finish()">Fertig</button></div></div>
  <div class="card"><span class="mut">Bisher</span><div class="chips" id="pol"><span class="faint">noch leer</span></div></div>`;this.texts()},
 tara(){tare();if(!this.ready){this.ready=true;this.texts()}},
 texts(){const t=this.target(),sum=this.pieces.reduce((a,b)=>a+b,0),last=this.pieces.length+1==this.count;
  $("pot").textContent="Stück "+(this.pieces.length+1)+" / "+this.count;
  $("pos").textContent=last?"Ziel "+fmt(t,1)+" g · letztes Stück":"Ziel "+fmt(t,1)+" g · Rest "+fmt(this.total-sum,1)+" g";
  $("pol").innerHTML=this.pieces.length?this.pieces.map((p,i)=>`<span class="chip">${i+1}: ${fmt(p,1)} g</span>`).join(""):'<span class="faint">noch leer</span>';
  if(this.ready)park(t)},
 live(){if(this.st=="setup"&&$("pow")){$("pow").innerHTML=`${fmt(S.g,1)}<small>g</small>`;
   $("poe").textContent=S.g>3?"je Stück "+fmt(S.g/this.count,1)+" g":"Ganzes auflegen";$("pogo").disabled=!(S.stable&&S.g>3&&!S.over);return}
  if(this.st!="run"||!$("pow"))return;const g=S.g,d=$("pod");
  if(!this.ready){$("pow").textContent="–";d.textContent="Waage leeren";d.className="pill n";
   if(Math.abs(S.gross)<5&&S.stable){tare();this.ready=true;this.texts()}return}
  const t=this.target(),tol=Math.max(1,t*.02);$("pow").textContent=fmt(g,1);
  if(g<3){if(this.on&&this.last>3){this.pieces.push(this.last);sound("save");this.on=false;this.last=0;
    if(this.pieces.length>=this.count){this.finish();return}this.texts()}
   d.textContent="Stück auflegen";d.className="pill n";this.since=0;setRing("#pob",0);return}
  this.on=true;const dv=g-t,st=dv<-tol?0:(dv<=tol?1:2);
  d.textContent=st==1?"passt":devTxt(dv);d.className="pill"+(st==1?"":(st==2?" d":" w"));
  setRing("#pob",g/t,st==2?"var(--dan)":(st==1?"var(--acc)":"var(--warn)"));
  if(S.stable){if(!this.since)this.since=Date.now();if(Date.now()-this.since>=600)this.last=g}else this.since=0},
 finish(){park(0);if(!this.pieces.length){this.st="setup";$("app").innerHTML=this.render();this.setup();return}this.st="result";$("app").innerHTML=this.render();this.result(true)},
 result(fresh){const p=this.pieces,n=p.length,sum=p.reduce((a,b)=>a+b,0),m=sum/n,lo=Math.min(...p),hi=Math.max(...p),
  sd=n>1?Math.sqrt(p.reduce((a,b)=>a+(b-m)*(b-m),0)/(n-1)):0;
  if(fresh){sound("done");logAdd(sum,"Portionen: "+n+" × "+fmt(m,1)+" g")}
  $("pob").innerHTML=`<div class="card center"><span class="mut">Fertig portioniert</span><div class="big">${n}<small>Stück</small></div>
  <div class="mid" style="color:var(--acc)">Ø ${fmt(m,1)} g</div></div>
  <div class="card"><table><tr><td>Kleinstes · größtes Stück</td><td class="r">${fmt(lo,1)} g · ${fmt(hi,1)} g</td></tr>
  <tr><td>Streuung s</td><td class="r">${fmt(sd,1)} g</td></tr><tr><td>Summe</td><td class="r">${fmt(sum,1)} g</td></tr></table>
  <div class="chips">${p.map((x,i)=>`<span class="chip">${i+1}: ${fmt(x,1)} g</span>`).join("")}</div>
  <span class="faint">Im Protokoll gespeichert</span><button class="p" onclick="P.portion.again()">Nochmal</button></div>`},
 again(){this.st="setup";$("app").innerHTML=this.render();this.setup()},
 leave(){park(0);if(this.st=="result")this.st="setup"}};

// ---------- Timer (laufen auf der Waage weiter) ----------
P.timer={d:null,set:ls("timer_min")||[5,10,15],names:["","",""],
 render(){return head("Timer")+`<div class="col" id="tib"><div class="card">Lade …</div></div>
  <span class="faint">Die Timer laufen auf der Waage, auch wenn diese Seite zu ist. Abgelaufen klingelt die Waage auf jeder Seite.</span>`},
 enter(){this.load();this.t=setInterval(()=>this.load(),1000)},
 leave(){clearInterval(this.t)},
 load(){get("/api/tools").then(d=>{if(!d||!d.timers||!$("tib"))return;const sig=d.timers.map(t=>t.run+"/"+t.ring).join();
  this.d=d;if(sig!==this.sig){this.sig=sig;this.draw()}else this.tick()})},
 draw(){$("tib").innerHTML=this.d.timers.map((t,i)=>t.run?`<div class="card center"><div class="top" style="width:100%"><h2>${esc(t.name)}</h2>
   <span class="pill ${t.ring?"d":""}">${t.ring?"abgelaufen":"läuft"}</span></div>
   <div class="big" id="tt${i}" style="${t.ring?"color:var(--dan)":""}">${tfmt(t.left)}</div>
   <div class="bar"><div id="tb${i}" style="width:${t.dur?100*(1-t.left/t.dur):0}%"></div></div>
   <div class="btns" style="width:100%">${t.ring?`<button class="p g" onclick="P.timer.op(${i},'stop=1')">Alarm aus</button>`
    :`<button class="g" onclick="P.timer.op(${i},'add=-60')">−1 min</button><button class="g" onclick="P.timer.op(${i},'add=60')">+1 min</button><button class="g d" onclick="P.timer.op(${i},'stop=1')">Stopp</button>`}</div></div>`
  :`<div class="card"><div class="top"><h2>${esc(t.name)}</h2><span class="pill n">aus</span></div>
   <div class="set"><span>Minuten</span>${stepper("tm"+i,this.set[i],1,1,600)}</div>
   <div class="chips">${[1,3,5,10,15,30,60].map(m=>`<button class="chip" onclick="$('tm${i}').value=${m}">${m} min</button>`).join("")}</div>
   <input id="tn${i}" maxlength="19" placeholder="Name (optional), z. B. Nudeln" value="${esc(this.names[i])}">
   <button class="p" onclick="P.timer.start(${i})">Starten</button></div>`).join("")},
 tick(){this.d.timers.forEach((t,i)=>{if(!t.run)return;const e=$("tt"+i),b=$("tb"+i);if(e)e.textContent=tfmt(t.left);
  if(b&&t.dur)b.style.width=(100*(1-t.left/t.dur))+"%"})},
 start(i){const m=Math.max(1,+$("tm"+i).value||1),n=$("tn"+i).value.trim();this.set[i]=m;this.names[i]=n;ls("timer_min",this.set);
  get("/api/timer?i="+i+"&s="+m*60+"&name="+encodeURIComponent(n)).then(()=>{this.sig="";this.load()})},
 op(i,q){get("/api/timer?i="+i+"&"+q).then(()=>{this.sig="";this.load()})},
 live(){}};

// ---------- Tassen & Löffel ----------
// 1 Tasse (US cup) = 236,6 ml, 1 EL = 1/16 Tasse, 1 TL = 1/48 Tasse. Gramm je Tasse: übliche Küchenwerte.
const CUPS=[["Mehl",125],["Zucker",200],["Puderzucker",120],["Brauner Zucker",213],["Butter",227],["Milch",240],["Wasser",237],
 ["Öl",218],["Honig",340],["Reis",185],["Haferflocken",90],["Kakao",85],["Nüsse gehackt",120],["Schokotropfen",170]];
function cupFrac(c){const q=Math.round(c*4),w=Math.floor(q/4),r=q%4,F=["","¼","½","¾"];return w&&r?w+" "+F[r]:(w?String(w):(r?F[r]:"0"))}
P.tassen={i:ls("cup_i")||0,goal:0,
 render(){return head("Tassen & Löffel")+`<div class="col">
  <div class="card"><span class="mut">Zutat</span><div class="chips">${CUPS.map((c,k)=>`<button class="chip ${k==this.i?"on":""}" onclick="P.tassen.pick(${k})">${c[0]}</button>`).join("")}</div>
  <span class="faint" id="tag">1 Tasse = ${CUPS[this.i][1]} g</span></div>
  <div class="card center" id="tab">${ring(0,`<div class="mid" id="tac" style="font-size:23px;max-width:180px;text-align:center">–</div><span class="pill n" id="tas">Zutat auflegen</span><span class="mut" id="taw"></span>`)}
  <div class="set" style="width:100%"><span>Ziel in Tassen</span><div class="stepper"><button onclick="P.tassen.step(-1)">−</button><span class="mid" id="tgl" style="min-width:80px;text-align:center">aus</span><button onclick="P.tassen.step(1)">+</button></div></div>
  <span class="pill n hide" id="tar"></span>
  <div class="rnd"><button class="p" onclick="tare()">Tara</button></div></div>
  <span class="faint">Für amerikanische Rezepte: 1 Tasse = 236,6 ml, 1 EL = 1/16 Tasse, 1 TL = 1/48 Tasse. Gramm je Tasse locker eingefüllt.</span></div>`},
 enter(){this.showGoal()},
 pick(k){this.i=k;ls("cup_i",k);this.goal=0;park(0);$("app").innerHTML=this.render();this.showGoal()},
 step(d){this.goal=Math.max(0,Math.min(40,this.goal+d));this.showGoal()},
 showGoal(){$("tgl").textContent=this.goal?cupFrac(this.goal/4):"aus";$("tar").classList.toggle("hide",!this.goal);
  park(this.goal?this.goal/4*CUPS[this.i][1]:0)},
 live(){if(!$("tac"))return;const g=S.g,gc=CUPS[this.i][1],c=g/gc;
  $("tac").textContent=c>0&&c<.125?"unter 1/8 Tasse":"ca. "+cupFrac(Math.max(0,c))+" Tassen";
  $("taw").textContent=fmt(g,1)+" g";
  const el=c*16,tl=c*48;$("tas").textContent=g<.5?"Zutat auflegen":(el<1?"= "+fmt(tl,1)+" TL":"= "+fmt(el,1)+" EL · "+Math.round(tl)+" TL");
  $("tas").className=g<.5?"pill n":"pill";
  if(this.goal){const goal=this.goal/4*gc,tol=Math.max(1,goal*.02),d=goal-g,st=d>tol?0:(d>=-tol?1:2);
   $("tar").textContent=st==0?"noch "+fmt(d,1)+" g":(st==1?"passt":fmt(-d,1)+" g zu viel");$("tar").className="pill"+(st==1?"":(st==2?" d":" n"));
   setRing("#tab",g/goal,st==2?"var(--dan)":"var(--acc)")}else setRing("#tab",0)},
 leave(){park(0)}};

// ---------- 2K mischen ----------
P.mix={st:"setup",b:ls("mix_b")||10,pot:ls("mix_pot")==null?20:ls("mix_pot"),a:0,bg:0,okSince:0,
 ratio(){const b=this.b;return b==100?"1 : 1":(100%b==0?(100/b)+" : 1":"100 : "+b)},
 render(){return head("2K mischen",true,this.st=="a"||this.st=="b"?`<a class="act" href="#" onclick="P.mix.reset();return false">Abbrechen</a>`:"")+`<div class="col" id="mxb"></div>`},
 enter(){this.st=="a"?this.aUi():(this.st=="b"?this.bUi():(this.st=="done"?this.done():this.setup()))},
 reset(){park(0);this.st="setup";$("app").innerHTML=this.render();this.setup()},
 setup(){this.st="setup";$("mxb").innerHTML=`<div class="card center"><span class="mut">Verhältnis A : B</span><div class="big" id="mxr">${this.ratio()}</div>
  <div class="stepper" style="width:100%;max-width:280px"><button onclick="P.mix.adj(-1)">−</button><input id="mxi" type="number" value="${this.b}" inputmode="numeric"><button onclick="P.mix.adj(1)">+</button></div>
  <span class="faint">Teile B je 100 Teile A</span>
  <div class="chips">${[[100,"1:1"],[50,"2:1"],[10,"10:1"],[5,"20:1"]].map(p=>`<button class="chip" onclick="P.mix.setB(${p[0]})">${p[1]}</button>`).join("")}</div></div>
  <div class="card"><div class="set"><span><b style="font-weight:500">Topfzeit</b><br><span class="faint">läuft danach als Timer auf der Waage</span></span>
  <select id="mxp">${[0,5,10,20,30,45,60,90].map(m=>`<option value="${m}" ${m==this.pot?"selected":""}>${m?m+" min":"aus"}</option>`).join("")}</select></div>
  <button class="p" onclick="P.mix.start()">Start</button><span class="faint">Leeren Becher auflegen, dann Start</span></div>`;
  $("mxi").oninput=()=>this.setB(+$("mxi").value,true)},
 adj(d){this.setB(this.b+d)},
 setB(v,typing){this.b=Math.max(1,Math.min(200,Math.round(v)||1));ls("mix_b",this.b);$("mxr").textContent=this.ratio();if(!typing)$("mxi").value=this.b},
 start(){this.pot=+$("mxp").value;ls("mix_pot",this.pot);tare();this.st="a";$("app").innerHTML=this.render();this.aUi()},
 aUi(){$("mxb").innerHTML=`<div class="card center"><span class="mut">Komponente A eingießen</span><div class="big" id="mxw">0,0<small>g</small></div>
  <div class="rnd"><button onclick="tare()">Tara</button><button class="p" id="mxn" onclick="P.mix.aDone()" disabled>A fertig</button></div></div>`},
 aDone(){if(!S.stable||S.g<=1)return;this.a=S.g;tare();sound("save");this.st="b";this.okSince=0;this.bUi()},
 goal(){return this.a*this.b/100},
 bUi(){const g=this.goal();park(g);$("mxb").innerHTML=`<div class="card center"><span class="mut">Komponente B · Ziel ${fmt(g,1)} g</span>
  ${ring(0,`<div class="big" id="mxw">0,0</div><span class="pill n" id="mxd">–</span>`)}
  <span class="faint">A ${fmt(this.a,1)} g · ${this.ratio()}</span>
  <button onclick="P.mix.finish()">Fertig</button></div>`},
 finish(){this.bg=S.g;this.st="done";park(0);$("app").innerHTML=this.render();this.done(true)},
 live(){if(this.st=="a"&&$("mxw")){$("mxw").innerHTML=`${fmt(S.g,1)}<small>g</small>`;$("mxn").disabled=!(S.stable&&S.g>1);return}
  if(this.st!="b"||!$("mxd"))return;const g=S.g,goal=this.goal(),tol=Math.max(.1,goal*.01),d=g-goal,st=d<-tol?0:(d<=tol?1:2);
  $("mxw").textContent=fmt(g,1);$("mxd").textContent=st==0?"noch "+fmt(-d,1)+" g":(st==1?"passt":fmt(d,1)+" g zu viel");
  $("mxd").className="pill"+(st==1?"":(st==2?" d":" n"));setRing("#mxb",g/goal,st==2?"var(--dan)":"var(--acc)");
  if(st==1&&S.stable){if(!this.okSince)this.okSince=Date.now();if(Date.now()-this.okSince>1500)this.finish()}else this.okSince=0},
 done(fresh){const real=this.a>0?this.bg/this.a*100:0,ok=Math.abs(real-this.b)<=this.b*.02+.05;
  $("mxb").innerHTML=`<div class="card center"><span class="mut">Gemischt</span><div class="big">${fmt(this.a+this.bg,1)}<small>g</small></div>
  <span class="mut">A ${fmt(this.a,1)} g · B ${fmt(this.bg,1)} g</span>
  <span class="pill ${ok?"":"w"}">100 : ${fmt(real,1)} (Soll ${this.ratio()})</span><span class="mut" id="mxt"></span>
  <span class="faint">Im Protokoll gespeichert</span><button class="p" onclick="P.mix.reset()">Nochmal</button></div>`;
  if(!fresh)return;sound("done");logAdd(this.a+this.bg,"2K "+this.ratio().replace(/ /g,"")+" · A "+fmt(this.a,1)+" g · B "+fmt(this.bg,1)+" g");
  if(this.pot>0)get("/api/tools").then(d=>{const i=(d.timers||[]).findIndex(t=>!t.run);
   if(i<0){$("mxt").textContent="Kein Timer frei für die Topfzeit";return}
   get("/api/timer?i="+i+"&s="+this.pot*60+"&name="+encodeURIComponent(tr("Topfzeit"))).then(()=>{if($("mxt"))$("mxt").textContent="Topfzeit "+this.pot+" min läuft"})})},
 leave(){park(0);if(this.st=="done")this.st="setup"}};

// ---------- Münzen ----------
const COINS=[["2 €",200,8.5],["1 €",100,7.5],["50 ct",50,7.8],["20 ct",20,5.74],["10 ct",10,4.1],["5 ct",5,3.92],["2 ct",2,3.06],["1 ct",1,2.3]];
const eur=c=>(c/100).toFixed(2).replace(".",",")+" €";
P.muenzen={i:0,sum:ls("coin_sum")||0,rows:ls("coin_rows")||[],
 render(){return head("Münzen")+`<div class="col">
  <div class="card"><span class="mut">Sorte</span><div class="chips" translate="no">${COINS.map((c,k)=>`<button class="chip ${k==this.i?"on":""}" onclick="P.muenzen.pick(${k})">${c[0]}</button>`).join("")}</div>
  <span class="faint">${fmt(COINS[this.i][2],2)} g je Münze · immer nur eine Sorte auf einmal</span></div>
  <div class="card center"><div class="big" id="mzn">0<small>Stück</small></div><div class="mid" style="color:var(--acc)" id="mzv">= 0,00 €</div>
  <span class="mut" id="mzi"></span>
  <div class="btns" style="width:100%"><button class="g" onclick="tare()">Tara</button><button class="p g" id="mza" onclick="P.muenzen.add()" disabled>+ Summe</button></div></div>
  <div class="card"><div class="top"><h2>Kassensturz</h2><span class="mid" style="font-size:22px">${eur(this.sum)}</span></div>
  ${this.rows.length?`<table>${this.rows.map(r=>`<tr><td>${r.n} × ${r.c}</td><td class="r">${eur(r.v)}</td></tr>`).join("")}</table>`:'<span class="faint">noch leer</span>'}
  <button class="d" onclick="P.muenzen.clear()">Summe löschen</button></div></div>`},
 pick(k){this.i=k;$("app").innerHTML=this.render()},
 n(){const n=S.g/COINS[this.i][2];return n>0?Math.round(n):0},
 live(){if(!$("mzn"))return;const n=this.n(),c=COINS[this.i],fr=Math.abs(S.g/c[2]-n);
  $("mzn").innerHTML=`${n}<small>Stück</small>`;$("mzv").textContent="= "+eur(n*c[1]);
  $("mzi").textContent=fmt(S.g,1)+" g"+(n>0&&fr>.3?" · unsicher, Sorte prüfen":"");$("mza").disabled=!(n>0&&S.stable)},
 add(){const n=this.n(),c=COINS[this.i];if(!n||!S.stable)return;const v=n*c[1];this.sum+=v;this.rows.push({n,c:c[0],v});
  ls("coin_sum",this.sum);ls("coin_rows",this.rows);logAdd(S.g,"Münzen: "+n+" × "+c[0]+" = "+eur(v));toast("Zur Summe addiert");$("app").innerHTML=this.render()},
 clear(){this.sum=0;this.rows=[];ls("coin_sum",0);ls("coin_rows",[]);$("app").innerHTML=this.render()}};

// ---------- Blindgießen ----------
P.blind={st:"setup",goal:ls("blind_goal")||150,turn:0,players:[],poured:[],phase:0,
 render(){return head("Blindgießen")+`<div class="col" id="blb"></div>`},
 enter(){if(this.st=="turn"){this.turnUi();return}PL.load().then(()=>this.setup())},
 setup(){this.st="setup";get("/api/hide?on=0");
  $("blb").innerHTML=`<div class="card"><div class="top"><h2>Mitspieler</h2><span class="mut">${PL.sel.length} gewählt</span></div>${PL.chips("P.blind.setup()")}</div>
  <div class="card"><div class="set"><span>Zielmenge</span>${stepper("blg",this.goal,10,30,1000)}</div>
  <button onclick="$('blg').value=50+Math.floor(Math.random()*26)*10">Zufall</button>
  <span class="faint">Ein Glas für alle. Jeder gießt die Zielmenge ein, ohne die Anzeige zu sehen – auch das Display der Waage bleibt verdeckt. Aufgelöst wird am Ende.</span>
  <button class="p" onclick="P.blind.start()" ${PL.sel.length<1?"disabled":""}>Los</button></div><div id="blboard"></div>`;
  PL.board("Blindgiessen","Bestenliste Blindgießen").then(h=>{if($("blboard"))$("blboard").innerHTML=h})},
 start(){this.goal=Math.max(30,Math.min(1000,+$("blg").value||150));ls("blind_goal",this.goal);this.players=PL.sel.slice();
  this.poured=this.players.map(()=>0);this.turn=0;get("/api/hide?on=1");this.st="turn";this.turnUi()},
 turnUi(){this.phase=0;$("blb").innerHTML=`<div class="card center"><span class="mut">Zug ${this.turn+1} / ${this.players.length}</span>
  <h1>${esc(this.players[this.turn])}</h1><div class="big" style="color:var(--faint)">? ? ?</div><span class="pill" id="bls">Waage leeren</span>
  <div class="rnd"><button onclick="P.blind.pour()">Tara</button><button class="p" id="bld" onclick="P.blind.next()" disabled>Fertig</button></div>
  <span class="faint">Danach Glas leeren</span></div>`},
 pour(){tare();this.phase=2},
 live(){if(this.st!="turn"||!$("bls"))return;const s=$("bls");
  if(this.phase==0){s.textContent="Waage leeren";if(Math.abs(S.gross)<5&&S.stable)this.phase=1}
  else if(this.phase==1){s.textContent="Leeres Glas auflegen";if(S.gross>20&&S.stable){tare();this.phase=2}}
  else s.textContent="Gieß "+this.goal+" g ein";
  $("bld").disabled=!(this.phase==2&&S.stable&&S.g>1)},
 next(){if(this.phase!=2||!S.stable)return;this.poured[this.turn]=S.g;sound("save");this.turn++;
  if(this.turn<this.players.length){this.turnUi();return}
  this.st="result";sound("drum");$("blb").innerHTML=`<div class="card center"><span class="mut">Auflösung</span><div class="big" style="color:var(--faint)">? ? ?</div></div>`;
  setTimeout(()=>this.result(),1400)},
 result(){if(!$("blb"))return;get("/api/hide?on=0");sound("done");
  const res=this.players.map((p,i)=>({p,g:this.poured[i],d:Math.abs(this.poured[i]-this.goal)})).sort((a,b)=>a.d-b.d);
  res.forEach(r=>api("/api/scores",{game:"Blindgiessen",name:r.p,value:Math.round(r.d*10)/10,unit:"g"}));
  logAdd(res[0].g,"Blindgießen: Sieger "+res[0].p);
  $("blb").innerHTML=`<div class="card center"><span class="mut">Ziel ${this.goal} g</span><h1 style="color:var(--acc)">${esc(res[0].p)}</h1></div>
  <div class="card"><table>${res.map((r,k)=>`<tr style="${k==0?"color:var(--acc);font-weight:600":""}"><td>${k+1}. ${esc(r.p)}</td><td class="r">${fmt(r.g,1)} g</td><td class="r">${fmt(r.d,1)} g daneben</td></tr>`).join("")}</table>
  <button class="p" onclick="P.blind.setup()">Nochmal</button></div>`;this.st="setup"},
 leave(){if(this.st!="setup")get("/api/hide?on=0");this.st="setup"}};

// ---------- Halbe-Halbe ----------
P.halb={st:"setup",turn:0,players:[],whole:[],half:[],phase:0,h:{},
 render(){return head("Halbe-Halbe")+`<div class="col" id="hhb"></div>`},
 enter(){if(this.st=="turn"){this.turnUi();return}PL.load().then(()=>this.setup())},
 setup(){this.st="setup";get("/api/hide?on=0");
  $("hhb").innerHTML=`<div class="card"><div class="top"><h2>Mitspieler</h2><span class="mut">${PL.sel.length} gewählt</span></div>${PL.chips("P.halb.setup()")}</div>
  <div class="card"><h2>So geht's</h2><span class="mut">Jeder bekommt ein Lebensmittel (Banane, Brot, Käse …). Ganz auflegen, abnehmen, teilen, eine Hälfte auflegen. Am nächsten an 50 % gewinnt.</span>
  <span class="faint">Messer und Brett bereitlegen. Die Anzeige bleibt bis zur Auflösung verdeckt, auch auf der Waage.</span>
  <button class="p" onclick="P.halb.start()" ${PL.sel.length<1?"disabled":""}>Los</button></div><div id="hhboard"></div>`;
  PL.board("Halbieren","Bestenliste Halbe-Halbe").then(h=>{if($("hhboard"))$("hhboard").innerHTML=h})},
 start(){this.players=PL.sel.slice();this.whole=this.players.map(()=>0);this.half=this.players.map(()=>0);this.turn=0;
  get("/api/hide?on=1");this.st="turn";this.turnUi()},
 dev(i){return this.whole[i]>0?Math.abs(this.half[i]/this.whole[i]*100-50):99},
 turnUi(){this.phase=0;this.h={};$("hhb").innerHTML=`<div class="card center" id="hht"><span class="mut">Zug ${this.turn+1} / ${this.players.length}</span>
  <h1>${esc(this.players[this.turn])}</h1>${ring(0,`<div class="big" id="hhv" style="color:var(--faint)">? ? ?</div><span class="pill" id="hhs">Waage leeren</span>`)}
  <span class="mut" id="hhx"></span><button class="p hide" id="hhn" onclick="P.halb.next()">${this.turn+1>=this.players.length?"Ergebnis":"Nächster"}</button></div>`},
 live(){if(this.st!="turn"||!$("hhs"))return;const g=S.g,s=$("hhs");
  switch(this.phase){
   case 0:s.textContent="Waage leeren";if(held(this.h,Math.abs(g)<3||Math.abs(S.gross)<5)){tare();this.phase=1;this.h={}}break;
   case 1:s.textContent="Ganzes Stück auflegen";if(held(this.h,g>5)){this.whole[this.turn]=g;sound("tick");this.phase=2;this.h={}}break;
   case 2:s.textContent="Abnehmen und teilen";if(held(this.h,g<3)){this.phase=3;this.h={}}break;
   case 3:s.textContent="Eine Hälfte auflegen";if(held(this.h,g>2.5)){this.half[this.turn]=g;this.phase=4;sound("drum");setTimeout(()=>this.reveal(),1400)}break}},
 reveal(){if(!$("hhv"))return;const i=this.turn,pct=this.half[i]/this.whole[i]*100;
  $("hhv").textContent=fmt(pct,1)+" %";$("hhv").style.color="var(--text)";$("hhs").textContent=fmt(this.dev(i),1)+" %-Punkte daneben";
  $("hhx").textContent="Hälfte "+fmt(this.half[i],1)+" g von "+fmt(this.whole[i],1)+" g";setRing("#hht",pct/100);
  $("hhn").classList.remove("hide");sound(this.dev(i)<=1?"done":"reached")},
 next(){this.turn++;if(this.turn<this.players.length){this.turnUi();return}this.result()},
 result(){get("/api/hide?on=0");sound("done");this.st="setup";
  const res=this.players.map((p,i)=>({p,i,pct:this.half[i]/(this.whole[i]||1)*100,d:this.dev(i)})).sort((a,b)=>a.d-b.d);
  res.forEach(r=>api("/api/scores",{game:"Halbieren",name:r.p,value:Math.round(r.d*10)/10,unit:"%"}));
  logAdd(this.half[res[0].i],"Halbe-Halbe: Sieger "+res[0].p);
  $("hhb").innerHTML=`<div class="card center"><span class="mut">Endstand</span><h1 style="color:var(--acc)">${esc(res[0].p)}</h1></div>
  <div class="card"><table>${res.map((r,k)=>`<tr style="${k==0?"color:var(--acc);font-weight:600":""}"><td>${k+1}. ${esc(r.p)}</td><td class="r">${fmt(r.pct,1)} %</td><td class="r">±${fmt(r.d,1)}</td></tr>`).join("")}</table>
  <span class="faint">Abweichung von 50 % in Prozentpunkten</span><button class="p" onclick="P.halb.setup()">Nochmal</button></div>`},
 leave(){if(this.st!="setup")get("/api/hide?on=0");this.st="setup"}};

// ---------- Einstellungen ----------
P.einstellungen={s:null,pick:{},render(){return head("Einstellungen")+`<div class="col" id="sb"><div class="card">Lade …</div></div>`},
 enter(){get("/api/settings").then(s=>{this.s=s;
  this.pick={unit:s.unit,scheme:s.scheme,voice:s.voice};this.draw()})},
 // Zeile mit Beschreibung darunter, wie in der Vorlage
 row(title,desc,ctrl,stack){return stack
   ? `<div class="set" style="flex-direction:column;align-items:stretch;gap:8px;padding:12px 0">
      <span><b style="font-weight:500">${title}</b>${desc?`<br><span class="faint">${desc}</span>`:""}</span>${ctrl}</div>`
   : `<div class="set"><span><b style="font-weight:500">${title}</b>${desc?`<br><span class="faint">${desc}</span>`:""}</span>${ctrl}</div>`},
 chips(key,opts,cur){return `<div class="chips" id="c_${key}">${opts.map((o,i)=>
   `<button class="chip ${((typeof cur=="number"?i:o)===cur)?"on":""}" onclick="P.einstellungen.set('${key}',${typeof cur=="number"?i:`'${String(o).replace(/'/g,"")}'`})">${esc(String(o))}</button>`).join("")}</div>`},
 set(key,val){this.pick[key]=val;
  const box=$("c_"+key);if(!box)return;
  const opts=[...box.children];
  opts.forEach((b,i)=>b.classList.toggle("on",typeof val=="number"?i===val:b.textContent===val))},
 draw(){const s=this.s,R=this.row.bind(this);
  $("sb").innerHTML=`<div class="sec">Wiegen</div><div class="card">
  ${R("Einheit","gilt für Wiegeseite und Protokoll",this.chips("unit",["g","kg","oz","lb","ml"],s.unit),true)}
  ${R("Flüssigkeit für ml","Dichte für die Einheit ml · an der Waage: Einheit antippen",`<select id="s_liquid">${(s.liquids||["Wasser"]).map((n,i)=>`<option value="${i}" ${i==(s.liquid||0)?"selected":""}>${esc(n)}</option>`).join("")}</select>`)}
  ${R("Auto-Speichern","einmal pro Auflegen, ab 5 g",swi("s_autosave",s.autosave))}
  ${R("Auto-Weiter","in Rezept und Cocktail bei stabilem, erreichtem Gewicht",swi("s_autonext",s.autonext))}
  ${R("Zur Wiegeseite nach","ohne Bedienung zurück zur Startseite",`<select id="s_idle">${[0,1,2,5,10].map(m=>`<option value="${m}" ${m==s.idle?"selected":""}>${m?m+" min":"aus"}</option>`).join("")}</select>`)}
  ${R("Auto-Null","folgt langsamer Drift der leeren Waage, damit sie auf 0,0 bleibt",swi("s_azt",s.azt!==false))}
  ${R("Präzision","mittelt ruhige Werte, zeigt zwei Nachkommastellen (nur g) · am Gerät: Gewicht lange drücken",swi("s_precise",!!s.precise))}
  ${R("Auto-Aus nach","ohne Bedienung und Gewichtsänderung",`<select id="s_autooff">${[0,10,15,30,60].map(m=>`<option value="${m}" ${m==s.autooff?"selected":""}>${m?"nach "+m+" min":"nie"}</option>`).join("")}</select>`)}</div>
  <div class="sec">Auto-Tara</div><div class="card">
  ${R("Topferkennung","erkennt einen leeren Topf und tariert nach dem Countdown",swi("s_autotara",s.autotara))}
  ${R("Countdown","Sekunden bis zum Tarieren",`<select id="s_cd">${[1,2,3,4,5,6,8,10].map(m=>`<option value="${m}" ${m==s.cd?"selected":""}>${m} s</option>`).join("")}</select>`)}
  ${R("Toleranz","oder 1 %, je nachdem was größer ist",`<select id="s_tol">${[3,5,10,20].map(m=>`<option value="${m}" ${m==s.tol?"selected":""}>±${m} g</option>`).join("")}</select>`)}</div>
  <div class="sec">Ton</div><div class="card">
  ${R("Lautstärke",`<span id="s_volv">${s.vol} %</span>`,`<input type="range" id="s_vol" min="0" max="100" step="10" value="${s.vol}" style="max-width:170px">`)}
  ${R("Tonschema","Sanft: tiefer und weicher · Retro: 8 Bit · Minimal: nur Piepser und Warnungen",this.chips("scheme",["Klassisch","Sanft","Retro","Minimal"],s.scheme),true)}
  ${R("Ansage","Zahlen = Gewicht vorlesen · Sprüche = Tara, Überlast … aus dem Stimmpaket",`<select id="s_speakm">${["Zahlen + Sprüche","nur Zahlen","nur Sprüche","aus"].map((t,i)=>`<option value="${i}" ${i==(s.speak?(s.speak_ev===false?1:0):(s.speak_ev?2:3))?"selected":""}>${t}</option>`).join("")}</select>`,true)}
  ${R("Stimme","Sprachpakete liegen unter /Waage/Stimme",this.chips("voice",(s.voices&&s.voices.length?s.voices:["Roboter"]),s.voice||(s.voices||["Roboter"])[0]),true)}
  ${R("Sprache","gilt für Display, Weboberfläche und Ansage",`<div class="chips" translate="no">${["Deutsch","English"].map((o,i)=>
   `<button class="chip ${i==(s.lang?1:0)?"on":""}" onclick="P.einstellungen.lang(${i})">${o}</button>`).join("")}</div>`)}
  ${s.voice_ok?R("Sprachbefehle","offline per Mikrofon, z. B. „Tara“, „Speichern“ · Pegel prüfen: am Gerät Setup → Ton → Mikrofon",swi("s_voiceon",!!s.voice_on)):""}
  <button onclick="P.einstellungen.save(true)">Speichern und Hörprobe</button></div>
  <div class="sec">Zeit und Funk</div><div class="card">
  ${R("Uhrzeit","Stand der Uhr in der Waage",`<span class="mut">${s.time||"–"}</span>`)}
  ${R("WLAN","Netzwerk, mit dem sich die Waage verbindet",`<span class="mut">${esc(s.ssid)||"eigenes WLAN"}</span>`)}
  <button onclick="get('/api/sync').then(()=>toast('Abgleich gestartet'))">Uhrzeit jetzt abgleichen</button></div>
  <div class="sec">Gespeicherte WLAN-Netze</div><div class="card" id="wl">Lade …</div>
  <div class="sec">Waage</div><div class="card">
  ${R("Kalibrierung","nur an der Waage, weil Gewichte aufgelegt werden",`<span class="mut">Faktor ${fmt(s.factor,2)}</span>`)}
  ${R("Prüfgewicht","bekanntes Gewicht zur regelmäßigen Kontrolle · 0 = aus",`<span style="display:flex;align-items:center;gap:6px"><input id="s_refg" type="number" inputmode="decimal" step="0.1" min="0" value="${s.ref_g||0}" style="max-width:110px"> g</span>`)}
  ${R("Erinnern alle","Waage fragt nach dem Start, wenn die Prüfung fällig ist",`<select id="s_refd">${[0,7,14,30,60,90,180].map(d=>`<option value="${d}" ${d==s.ref_days?"selected":""}>${d?d+" Tage":"nie"}</option>`).join("")}</select>`)}
  ${R("Toleranz Prüfgewicht","erlaubte Abweichung",`<select id="s_reft">${[0.1,0.2,0.5,1,2,5].map(t=>`<option value="${t}" ${Math.abs(t-(s.ref_tol||0.5))<0.01?"selected":""}>±${fmt(t,1)} g</option>`).join("")}</select>`)}
  <div class="set" style="flex-direction:column;align-items:stretch;gap:4px;padding:10px 0">${P.einstellungen.refInfo(s)}</div>
  ${R("Messmittelprüfung","Verfahren 1: Cg und Cgk",`<a class="btn sm" href="#/msa">Prüfen ›</a>`)}
  ${R("Libelle","Versatz des Displays auf null setzen",`<button class="sm" onclick="get('/api/level_reset').then(()=>toast('Nullpunkt zurückgesetzt'))">Zurücksetzen</button>`)}
  ${R("Spielernamen","gilt für alle Spiele",`<a class="btn sm" href="#/spieler">Namen ›</a>`)}
  ${R("Firmware-Update","ohne Kabel über die Weboberfläche",`<a class="btn sm" href="#/firmware">Update ›</a>`)}</div>
  <button class="p" onclick="P.einstellungen.save(false)">Einstellungen speichern</button>`;
  $("s_vol").oninput=()=>{$("s_volv").textContent=$("s_vol").value+" %"};this.wlan()},
 // Mehrere WLAN-Netze: die Waage nimmt das stärkste gespeicherte Netz in Reichweite
 wlan(){get("/api/wlan").then(w=>{const box=$("wl");if(!box)return;const nets=w.nets||[];
  box.innerHTML=`<span class="faint">Die Waage verbindet sich mit dem stärksten gespeicherten Netz in Reichweite. Bis zu ${w.max||5} Netze.</span>
  ${nets.length?nets.map((n,i)=>`<div class="set"><span><b style="font-weight:500">${esc(n)}</b>${n===w.cur?`<br><span class="faint">zuletzt verbunden</span>`:""}</span>
   <button class="sm" onclick="P.einstellungen.wdel(${i})">Entfernen</button></div>`).join(""):`<div class="set"><span class="mut">Kein Netzwerk gespeichert</span></div>`}
  <div class="set" style="flex-direction:column;align-items:stretch;gap:8px;padding:12px 0"><b style="font-weight:500">Netz hinzufügen</b>
   <input id="w_ssid" style="width:100%;max-width:none" maxlength="32" placeholder="Netzwerkname (SSID)" autocomplete="off">
   <input id="w_pass" style="width:100%;max-width:none" type="password" maxlength="64" placeholder="Passwort (leer bei offenem Netz)" autocomplete="new-password">
   <button onclick="P.einstellungen.wadd()">Hinzufügen</button>
   <span class="faint">Die aktuelle Verbindung bleibt bestehen. Das neue Netz wird beim nächsten Verbinden genutzt, zum Beispiel an einem anderen Ort.</span></div>`})},
 wadd(){const ss=$("w_ssid").value.trim(),pw=$("w_pass").value;
  if(!ss){toast("Bitte Namen eingeben");return}
  api("/api/wlan",{ssid:ss,pass:pw}).then(r=>{toast(r.ok?"Gespeichert":(r.msg||"Fehler"));if(r.ok)this.wlan()})},
 wdel(i){if(!confirm("Netz entfernen?"))return;get("/api/wlan/del?i="+i).then(r=>{toast(r.ok?"Gelöscht":"Fehler");this.wlan()})},
 // Prüfgewicht: letzte Prüfung, nächster Termin, Verlauf als CSV
 refInfo(s){if(!(s.ref_g>0))return `<span class="faint">Prüfgewicht ist aus.</span>`;
  const dev=s.ref_meas-s.ref_g;
  const last=s.ref_last?`<span class="${s.ref_ok?"mut":""}" style="${s.ref_ok?"":"color:var(--warn)"}">Zuletzt ${s.ref_last}: ${fmt(s.ref_meas,2)} g (${dev<0?"−":"+"}${fmt(Math.abs(dev),2)} g) ${s.ref_ok?"OK":"außer Toleranz"}</span>`
   :`<span class="mut">Noch nicht geprüft</span>`;
  const due=s.ref_due?`<span class="pill w" style="align-self:flex-start">Prüfung fällig</span>`:(s.ref_next?`<span class="faint">Nächste Prüfung ${s.ref_next}</span>`:"");
  return last+due+`<span class="faint">Prüfen an der Waage: Setup → Waage → Prüfgewicht · <a class="act" href="/file?path=%2FWaage%2FPruefung%2Fpruefgewicht.csv">Verlauf (CSV)</a></span>`},
 // Sprache sofort umstellen (Waage und Browser), die Seite neu aufbauen
 lang(l){get("/api/lang?l="+l).then(r=>{if(!r.ok){toast("Fehler");return}setLang(l);route()})},
 save(test){const v=id=>$(id),s={unit:this.pick.unit,autosave:v("s_autosave").checked,autonext:v("s_autonext").checked,idle:+v("s_idle").value,autooff:+v("s_autooff").value,autotara:v("s_autotara").checked,precise:v("s_precise").checked,ref_g:+String(v("s_refg").value).replace(",",".")||0,ref_days:+v("s_refd").value,ref_tol:+v("s_reft").value,liquid:+v("s_liquid").value,azt:v("s_azt").checked,
  cd:+v("s_cd").value,tol:+v("s_tol").value,vol:+v("s_vol").value,scheme:this.pick.scheme,speak:+v("s_speakm").value<2,speak_ev:+v("s_speakm").value%2==0,...(v("s_voiceon")?{voice_on:v("s_voiceon").checked}:{}),voice:this.pick.voice,porto:this.s.porto};
  api("/api/settings",s).then(()=>{toast("Gespeichert");if(test)get("/api/speak_test")})}};

// ============================================================
//  Router
// ============================================================
function route(){const key=(location.hash.replace(/^#\/?/,"")||"");const next=P[key]||P[""];
 if(page&&page!==next&&page.leave)page.leave();page=next;
 document.title=tr((key?(next.title||key.charAt(0).toUpperCase()+key.slice(1))+" · ":"")+"Waage");
 $("app").innerHTML=next.render();if(next.enter)next.enter();if(next.live)next.live();window.scrollTo(0,0)}
window.addEventListener("hashchange",route);
setLang(LANG);
get("/api/settings").then(s=>{if(s&&s.autonext!==undefined)AUTONEXT=!!s.autonext;
 if(s&&s.lang!==undefined&&(s.lang?1:0)!==LANG){setLang(s.lang);route()}});  // Sprache der Waage übernehmen
route();tick();poll=setInterval(tick,600);
</script>
</body>
</html>
