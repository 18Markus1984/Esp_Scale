<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Waage · Aufnahme</title>
<meta name="theme-color" content="#090909">
<!--
  Aufnahmeseite für „Eigene Stimme“ (GitHub Pages, https).
  Browser geben das Mikrofon nur auf https-Seiten frei, die Waage läuft über http://waage.local.
  Darum öffnet die Weboberfläche der Waage diese Seite in einem neuen Tab: hier wird mit dem
  Mikrofon des Handys aufgenommen, in 16 kHz Mono-WAV umgerechnet und per postMessage an den
  Tab der Waage zurückgegeben. Der lädt die Datei auf die SD-Karte (gleiche Adresse, kein https nötig).
  Nachrichten:  hier -> Waage {t:"hallo"} · {t:"wav",f,buf} · {t:"fertig"}
                Waage -> hier {t:"slots",pack,slots,cur,lang} · {t:"ok",f} · {t:"err",f,msg}
  Es wird nur mit dem Fenster gesprochen, das diese Seite geöffnet hat (Adresse im Parameter o).
-->
<style>
:root{--bg:#090909;--card:#181818;--card2:#121212;--line:#2C2C2C;--text:#F4F4F1;--text2:#C4C4C0;--mut:#9C9C98;--faint:#62625F;
--acc:#3DDC97;--on-acc:#0B1F16;--accbg:#14281F;--dan:#FF6B5E;--danbg:#2B1714;--track:#232323}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 34px;display:flex;flex-direction:column;gap:14px}
.hdr{display:flex;align-items:center;justify-content:space-between;min-height:48px}
.hdr .t{font:600 20px/1.2 "Space Grotesk",system-ui,sans-serif}
h2{margin:0;font:600 17px/1.3 "Space Grotesk",system-ui,sans-serif}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mut{color:var(--mut);font-size:14px}.faint{color:var(--faint);font-size:13px}
.pill{font-size:13px;padding:5px 11px;border-radius:14px;background:var(--accbg);color:var(--acc);white-space:nowrap}
.pill.d{background:var(--danbg);color:var(--dan)}
.bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden}.bar>div{height:8px;background:var(--acc);width:0;transition:width .3s}
.btns{display:flex;gap:10px}
button{min-height:46px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--text);
font:500 16px/1 inherit;font-family:inherit;cursor:pointer;flex:1}
button.p{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
button:disabled{opacity:.4}
.say{text-align:center;padding:10px 0 2px}
.say .s{font:600 28px/1.25 "Space Grotesk",system-ui,sans-serif;margin:6px 0}
.mic{display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 0}
#hold{width:128px;height:128px;border-radius:64px;flex:none;font-size:15px;line-height:1.3;touch-action:none;user-select:none;
-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .15s,background-color .15s;position:relative}
#hold svg{display:block;margin:0 auto 4px;width:30px;height:30px}
#hold.on{background:var(--dan);border-color:var(--dan);transform:scale(1.08)}
#hold.on:after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--dan);opacity:.5;animation:p 1s infinite}
@keyframes p{from{transform:scale(.92);opacity:.6}to{transform:scale(1.12);opacity:0}}
#lvl{width:160px}
#st{text-align:center;min-height:22px}
.wave{height:44px;width:100%;display:block}
</style>
</head>
<body>
<div class="wrap">
 <div class="hdr"><span class="t" id="ttl">Eigene Stimme</span><span class="pill" id="conn">mit der Waage verbunden</span></div>
 <div id="main"><div class="card"><span class="mut">Verbinde mit der Waage …</span></div></div>
</div>
<script>
const EN_={"Eigene Stimme":"Own voice","mit der Waage verbunden":"connected to the scale","nicht verbunden":"not connected",
"Sag zum Beispiel":"Say for example","oder mit eigenen Worten":"or in your own words","Gedrückt halten":"Hold down","Aufnahme":"Recording",
"Halten und ins Handy sprechen":"Hold and speak into your phone","Sprich jetzt … dann loslassen":"Speak now … then let go",
"Hör mal rein – passt es?":"Have a listen – does it fit?","Nochmal anhören":"Listen again","Später":"Later","Passt ›":"Good ›",
"Zu kurz – länger halten":"Too short – hold longer","Zu leise – näher ans Handy":"Too quiet – closer to the phone",
"Wird zur Waage geschickt …":"Sending to the scale …","Gespeichert":"Saved","Kein Zugriff aufs Mikrofon. Bitte in den Browser-Einstellungen erlauben.":"No microphone access. Please allow it in the browser settings.",
"Fertig":"Done","Zurück zur Waage":"Back to the scale","Alle Ansagen dieser Gruppe sind durch.":"All announcements of this group are done.",
"Diese Seite wird von der Weboberfläche der Waage geöffnet: Einstellungen → Eigene Stimme → Im Browser aufnehmen.":"This page is opened from the scale's web interface: Settings → Own voice → Record in the browser.",
"Das Fenster der Waage ist zu. Bitte dort neu starten.":"The scale's tab was closed. Please start again there.",
"Ansagen":"Announcements","Sprachsteuerung":"Voice control","Wörter und Einheiten":"Words and units","Zahlen":"Numbers"};
let EN=0;const tr=t=>EN&&EN_[t]||t,esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),$=id=>document.getElementById(id);
const G=["Ansagen","Sprachsteuerung","Wörter und Einheiten","Zahlen"];
const MIC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5v3"/></svg>';
const q=new URLSearchParams(location.search),ORIGIN=q.get("o")||"",DEMO=q.has("demo");
const W={d:null,cur:0,blob:null,url:null,stream:null,mr:null,chunks:[],t0:0,busy:0,
 send(m,tf){if(DEMO)return this.demo(m);if(!opener||opener.closed)return this.lost();opener.postMessage(m,ORIGIN,tf||[])},
 lost(){$("conn").textContent=tr("nicht verbunden");$("conn").className="pill d";
  $("main").innerHTML=`<div class="card"><span class="mut">${tr(opener?"Das Fenster der Waage ist zu. Bitte dort neu starten.":"Diese Seite wird von der Weboberfläche der Waage geöffnet: Einstellungen → Eigene Stimme → Im Browser aufnehmen.")}</span></div>`},
 // Demo ohne Waage (?demo): Antworten der Waage nachgespielt
 demo(m){const r=x=>setTimeout(()=>this.msg({data:x,origin:ORIGIN}),300);
  if(m.t=="hallo")r({t:"slots",pack:"Eigene Stimme",cur:0,lang:q.get("lang")=="en"?1:0,slots:[
   {f:"tara",t:"Tara",g:0,s:6,m:0,w:"nach Tara (Waage auf null)"},{f:"gespeichert",t:"Gespeichert",g:0,s:6,m:0,w:"wenn ein Gewicht gespeichert wurde"},
   {f:"ziel_erreicht",t:"Ziel erreicht",g:0,s:6,m:0,w:"wenn das Zielgewicht erreicht ist"}]});
  if(m.t=="wav")r({t:"ok",f:m.f})},
 msg(e){if(e.origin!==ORIGIN||!e.data)return;const m=e.data;
  if(m.t=="slots"){this.d=m;this.cur=m.cur||0;EN=m.lang?1:0;document.documentElement.lang=EN?"en":"de";
   $("ttl").textContent=tr("Eigene Stimme");$("conn").textContent=tr("mit der Waage verbunden");this.draw()}
  if(m.t=="ok"){const x=this.d.slots.find(s=>s.f==m.f);if(x)x.m=1;this.busy=0;this.next()}
  if(m.t=="err"){this.busy=0;this.st(m.msg||"Fehler","dan");this.btns()}},
 group(){const g=this.d.slots[this.cur].g;return this.d.slots.map((x,i)=>i).filter(i=>this.d.slots[i].g==g)},
 draw(){const x=this.d.slots[this.cur],ix=this.group(),k=ix.indexOf(this.cur)+1,w=x.w?x.w[0].toUpperCase()+x.w.slice(1):"";
  this.clear();
  $("main").innerHTML=`<div class="card"><div class="top"><span class="mut">${tr(G[x.g])}</span><span class="faint">${k} / ${ix.length}</span></div>
   <div class="bar"><div style="width:${Math.round(k*100/ix.length)}%"></div></div>
   <span class="mut">${esc(w)}</span>
   <div class="say"><div class="faint">${tr("Sag zum Beispiel")}</div><div class="s" style="font-size:${x.t.length>30?20:28}px">${esc(x.t)}</div>
    <div class="faint">${tr("oder mit eigenen Worten")}</div></div>
   <div class="mic"><button class="p" id="hold">${MIC}${tr("Gedrückt halten")}</button>
    <span class="mut" id="st">${tr("Halten und ins Handy sprechen")}</span>
    <canvas class="wave" id="wave" width="600" height="88"></canvas></div>
   <div class="btns"><button id="again" disabled>${tr("Nochmal anhören")}</button><button id="ok">${tr("Später")}</button></div></div>`;
  const h=$("hold");
  h.addEventListener("pointerdown",e=>{e.preventDefault();h.setPointerCapture&&h.setPointerCapture(e.pointerId);this.down()});
  ["pointerup","pointercancel"].forEach(n=>h.addEventListener(n,e=>{e.preventDefault();this.up()}));
  h.addEventListener("contextmenu",e=>e.preventDefault());
  $("again").onclick=()=>this.play();$("ok").onclick=()=>this.ok();this.drawWave(null)},
 st(t,c){const e=$("st");if(e){e.textContent=tr(t);e.style.color=c?"var(--"+c+")":""}},
 btns(){const a=$("again"),o=$("ok");if(!a)return;a.disabled=!this.blob||this.busy;o.disabled=!!this.busy;
  o.textContent=tr(this.blob?"Passt ›":"Später");o.className=this.blob?"p":""},
 clear(){if(this.url)URL.revokeObjectURL(this.url);this.blob=null;this.url=null;this.wav=null},
 // Mikrofon einmal holen und offen lassen (sonst fragt der Browser jedes Mal)
 mic(){if(this.stream)return Promise.resolve(this.stream);
  return navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:true,autoGainControl:true}}).then(s=>{
   this.stream=s;const AC=window.AudioContext||window.webkitAudioContext;this.ac=new AC();this.an=this.ac.createAnalyser();
   this.an.fftSize=1024;this.ac.createMediaStreamSource(s).connect(this.an);return s})},
 down(){if(this.mr||this.busy)return;this.held=1;
  this.mic().then(s=>{if(!this.held)return;this.ac.resume&&this.ac.resume();this.chunks=[];this.mr=new MediaRecorder(s);
   this.mr.ondataavailable=e=>e.data.size&&this.chunks.push(e.data);this.mr.onstop=()=>this.done();
   this.mr.start();this.t0=Date.now();$("hold").classList.add("on");$("hold").innerHTML=MIC+tr("Aufnahme");this.st("Sprich jetzt … dann loslassen","acc");
   const max=this.d.slots[this.cur].s*1000;this.lim=setTimeout(()=>this.up(),max);this.meter()})
  .catch(()=>{this.held=0;this.st("Kein Zugriff aufs Mikrofon. Bitte in den Browser-Einstellungen erlauben.","dan")})},
 // loslassen: 300 ms nachlaufen lassen, damit das letzte Wort nicht abgeschnitten wird
 up(){this.held=0;clearTimeout(this.lim);if(!this.mr)return;const mr=this.mr;
  setTimeout(()=>{if(mr.state!="inactive")mr.stop()},300);$("hold").classList.remove("on");$("hold").innerHTML=MIC+tr("Gedrückt halten")},
 meter(){const c=$("wave");if(!c||!this.mr)return;const b=new Uint8Array(this.an.fftSize);this.an.getByteTimeDomainData(b);
  this.live=(this.live||[]).concat([Math.max(...b.map(v=>Math.abs(v-128)))/128]).slice(-120);this.drawWave(this.live);requestAnimationFrame(()=>this.meter())},
 drawWave(p){const c=$("wave");if(!c)return;const g=c.getContext("2d"),W_=c.width,H=c.height;g.clearRect(0,0,W_,H);
  const n=120,bw=W_/n;g.fillStyle=getComputedStyle(document.body).getPropertyValue(this.mr?"--dan":"--acc");
  for(let i=0;i<n;i++){const v=p?(p[i-(n-p.length)]||0):0,h=Math.max(3,v*H);g.globalAlpha=p?1:.25;g.fillRect(i*bw+1,(H-h)/2,bw-2,h)}},
 done(){this.mr=null;const dur=Date.now()-this.t0,blob=new Blob(this.chunks,{type:this.chunks[0]&&this.chunks[0].type||"audio/webm"});
  if(dur<450){this.st("Zu kurz – länger halten","dan");this.drawWave(null);return}
  blob.arrayBuffer().then(b=>toWav(b)).then(r=>{this.clear();this.wav=r.wav;this.blob=r.blob;this.url=URL.createObjectURL(r.blob);
   this.drawWave(r.peaks);this.st("Hör mal rein – passt es?","acc");this.btns();this.play()})
  .catch(e=>{this.st(e&&e.message=="leise"?"Zu leise – näher ans Handy":"Fehler: "+(e&&e.message||e),"dan");this.drawWave(null)})},
 play(){if(!this.url)return;if(this.au)this.au.pause();this.au=new Audio(this.url);this.au.play().catch(()=>{})},
 ok(){if(!this.blob){this.next();return}const x=this.d.slots[this.cur];this.busy=1;this.btns();this.st("Wird zur Waage geschickt …");
  const buf=this.wav.slice(0);this.send({t:"wav",f:x.f,buf},[buf])},
 next(){const ix=this.group(),k=ix.indexOf(this.cur);
  if(k+1<ix.length){this.cur=ix[k+1];this.draw();scrollTo(0,0);return}
  this.clear();this.send({t:"fertig",g:this.d.slots[this.cur].g});
  const m=ix.filter(i=>this.d.slots[i].m).length;
  $("main").innerHTML=`<div class="card" style="text-align:center"><h2>${tr(G[this.d.slots[this.cur].g])}</h2>
   <span class="mut">${EN?`${m} of ${ix.length} recorded yourself`:`${m} von ${ix.length} selbst aufgenommen`}</span><span class="faint">${tr("Alle Ansagen dieser Gruppe sind durch.")}</span>
   <button class="p" onclick="W.back()">${tr("Zurück zur Waage")}</button></div>`;
  if(this.stream){this.stream.getTracks().forEach(t=>t.stop());this.stream=null}},
 back(){try{opener&&opener.focus()}catch(e){}window.close()}};

// Aufnahme (webm/mp4/…) -> 16 kHz Mono 16 Bit WAV, Stille vorn/hinten weg, normalisiert (wie an der Waage)
function toWav(buf){const AC=window.AudioContext||window.webkitAudioContext,ac=new AC();
 return new Promise((ok,bad)=>ac.decodeAudioData(buf,ok,bad)).then(ab=>{
  const r=ab.sampleRate/16000,n=Math.floor(ab.length/r),a=new Float32Array(n),chs=[];
  for(let ch=0;ch<ab.numberOfChannels;ch++)chs.push(ab.getChannelData(ch));
  for(let i=0;i<n;i++){let s=0;const j=Math.floor(i*r);for(const c of chs)s+=c[j];a[i]=s/chs.length}
  let pk=0;for(const v of a)pk=Math.max(pk,Math.abs(v));if(pk<0.02)throw new Error("leise");
  let s0=0,e=n-1;while(s0<n&&Math.abs(a[s0])<pk/12)s0++;while(e>s0&&Math.abs(a[e])<pk/12)e--;
  s0=Math.max(0,s0-1280);e=Math.min(n-1,e+1280);const len=e-s0+1,ab2=new ArrayBuffer(44+len*2),dv=new DataView(ab2);
  const w=(o,t)=>{for(let k=0;k<t.length;k++)dv.setUint8(o+k,t.charCodeAt(k))};
  w(0,"RIFF");dv.setUint32(4,36+len*2,true);w(8,"WAVEfmt ");dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);
  dv.setUint32(24,16000,true);dv.setUint32(28,32000,true);dv.setUint16(32,2,true);dv.setUint16(34,16,true);w(36,"data");dv.setUint32(40,len*2,true);
  const f=0.85/pk,peaks=new Array(120).fill(0);
  for(let k=0;k<len;k++){const v=a[s0+k]*f;dv.setInt16(44+k*2,Math.max(-32768,Math.min(32767,Math.round(v*32767))),true);
   const b=Math.floor(k*120/len);peaks[b]=Math.max(peaks[b],Math.abs(v))}
  ac.close&&ac.close();return {wav:ab2,blob:new Blob([ab2],{type:"audio/wav"}),peaks}})}

addEventListener("message",e=>W.msg(e));
if(!DEMO&&(!opener||!ORIGIN))W.lost();else W.send({t:"hallo"});
</script>
</body>
</html>
